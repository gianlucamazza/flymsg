[project]
name = "flymsg"
version = "0.8.49"
description = "Simulate and view the complete male Drosophila CNS connectome (MaleCNS v1.0)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Gianluca Mazza", email = "info@gianlucamazza.it" }
]
keywords = ["connectome", "drosophila", "neuroscience", "simulation", "leaky integrate-and-fire"]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Intended Audience :: Science/Research",
]
requires-python = ">=3.13"
dependencies = [
    "flygym==2.1.0",
    "markdown>=3.11",
    "numba>=0.67",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pillow>=13.0.0",
    "pyarrow>=25.0.1",
    "rdata>=1.1",
    "scipy>=1.18.1",
]

[project.urls]
Repository = "https://github.com/gianlucamazza/flymsg"
Changelog = "https://github.com/gianlucamazza/flymsg/blob/main/CHANGELOG.md"

[project.scripts]
flymsg = "flymsg:main"

[build-system]
requires = ["uv_build>=0.9.15,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.uv]
# flygym==2.1.0 (and 2.1.1) still declare pillow<13; override so the lock can take 13.0.0,
# the first release patched for the Pillow Dependabot alerts (#310). Remove the override once
# flygym allows 13. tests/test_pillow_compat.py exercises flygym, imageio, mediapy and
# matplotlib under 13 and fails if the resolver falls back below it.
override-dependencies = [
    "pillow>=13.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs the full-connectome validation battery (minutes)"]
addopts = "-m 'not slow'"
