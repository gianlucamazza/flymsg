[project]
name = "flymsg"
version = "0.5.2"
description = "Simulate and view the complete male Drosophila CNS connectome (MaleCNS v1.0)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Gianluca Mazza", email = "info@gianlucamazza.it" }
]
keywords = ["connectome", "drosophila", "neuroscience", "simulation", "leaky integrate-and-fire"]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Intended Audience :: Science/Research",
]
requires-python = ">=3.13"
dependencies = [
    "numba>=0.67",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "scipy>=1.18.1",
]

[project.urls]
Repository = "https://github.com/gianlucamazza/flymsg"
Changelog = "https://github.com/gianlucamazza/flymsg/blob/main/CHANGELOG.md"

[project.scripts]
flymsg = "flymsg:main"

[build-system]
requires = ["uv_build>=0.9.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
markers = ["slow: runs the full-connectome validation battery (minutes)"]
addopts = "-m 'not slow'"
