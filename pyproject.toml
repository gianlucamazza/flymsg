[project]
name = "flymsg"
version = "0.4.0"
description = "Explore and simulate the male Drosophila CNS connectome"
readme = "README.md"
authors = [
    { name = "Gianluca", email = "info@gianlucamazza.it" }
]
requires-python = ">=3.13"
dependencies = [
    "networkx>=3.6.1",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "scipy>=1.18.1",
]

[project.scripts]
flymsg = "flymsg:main"

[build-system]
requires = ["uv_build>=0.9.15,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
markers = ["slow: runs the full-connectome validation battery (minutes)"]
addopts = "-m 'not slow'"
