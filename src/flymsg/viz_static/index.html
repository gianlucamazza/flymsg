<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>flymsg 3D</title>
    <style>
      :root {
        --bg: #05070a;
        --fg: #d8dee9;
        --muted: #7b8494;
        --panel: rgba(12, 16, 22, 0.82);
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font: 13px/1.4 system-ui, sans-serif;
        overflow: hidden;
      }
      canvas {
        display: block;
      }
      #hud {
        position: fixed;
        left: 12px;
        bottom: 12px;
        max-width: min(420px, calc(100vw - 24px));
        padding: 10px 12px;
        background: var(--panel);
        border-radius: 8px;
        pointer-events: none;
      }
      #hud .muted {
        color: var(--muted);
      }
      #legend span {
        display: inline-block;
        margin-right: 10px;
        white-space: nowrap;
      }
      #legend i {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        margin-right: 4px;
        vertical-align: -1px;
      }
      #clock {
        font-variant-numeric: tabular-nums;
      }
      #selection {
        position: fixed;
        left: 12px;
        top: 12px;
        max-width: min(460px, calc(100vw - 24px));
        max-height: calc(100vh - 220px);
        overflow: auto;
        padding: 10px 12px;
        background: var(--panel);
        border-radius: 8px;
      }
      #selection pre {
        margin: 0;
        font: inherit;
        white-space: pre-wrap;
      }
      #selection button {
        float: right;
        margin-left: 8px;
        background: none;
        color: var(--fg);
        border: 1px solid var(--muted);
        border-radius: 4px;
        cursor: pointer;
      }
      #raster {
        position: fixed;
        right: 12px;
        bottom: 12px;
        padding: 8px 10px;
        background: var(--panel);
        border-radius: 8px;
        max-width: calc(100vw - 24px);
        max-height: 45vh;
        overflow: auto;
      }
      #raster header {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 4px;
        color: var(--muted);
      }
      #raster button {
        margin-left: auto;
        background: none;
        color: var(--fg);
        border: 1px solid var(--muted);
        border-radius: 4px;
        cursor: pointer;
      }
      #raster canvas {
        display: block;
        cursor: ew-resize;
        touch-action: none;
      }
      @media (max-width: 900px) {
        #raster {
          left: 12px;
          bottom: 150px;
        }
      }
      #compare {
        position: fixed;
        left: 50%;
        top: 12px;
        transform: translateX(-50%);
        max-width: min(560px, calc(100vw - 24px));
        padding: 8px 12px;
        background: var(--panel);
        border-radius: 8px;
        pointer-events: none;
      }
      #compare pre {
        margin: 0;
        font: inherit;
        white-space: pre-wrap;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: var(--muted);
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/build/three.module.min.js",
          "three/addons/": "./vendor/three/examples/jsm/",
          "lil-gui": "./vendor/lil-gui/lil-gui.esm.min.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="loading">loading scene…</div>
    <section id="compare" hidden aria-label="the two runs compared"><pre></pre></section>
    <section id="raster" hidden aria-label="spike raster of the selection">
      <header>
        <span>spikes per 10 ms bin (model replay) · drag to move in time · ← → step one bin</span>
        <button type="button">export</button>
      </header>
      <canvas></canvas>
      <div class="more muted"></div>
    </section>
    <section id="selection" hidden aria-live="polite" aria-label="selected neuron">
      <button type="button" aria-label="clear the selection (Esc)">clear</button>
      <pre></pre>
    </section>
    <div id="hud">
      <div id="clock"></div>
      <div id="stats" class="muted"></div>
      <div id="perf" class="muted"></div>
      <div id="legend"></div>
      <div id="info" class="muted">click a neuron for details · drag to rotate · scroll to zoom</div>
    </div>
    <script type="module" src="main.js"></script>
  </body>
</html>
