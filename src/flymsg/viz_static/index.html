<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>flymsg 3D</title>
    <style>
      :root {
        --bg: #05070a;
        --fg: #d8dee9;
        --muted: #7b8494;
        --panel: rgba(12, 16, 22, 0.82);
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font: 13px/1.4 system-ui, sans-serif;
        overflow: hidden;
      }
      canvas {
        display: block;
      }
      #hud {
        position: fixed;
        left: 12px;
        bottom: 12px;
        max-width: min(420px, calc(100vw - 24px));
        padding: 10px 12px;
        background: var(--panel);
        border-radius: 8px;
        pointer-events: none;
      }
      #hud .muted {
        color: var(--muted);
      }
      #legend span {
        display: inline-block;
        margin-right: 10px;
        white-space: nowrap;
      }
      #legend i {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        margin-right: 4px;
        vertical-align: -1px;
      }
      #clock {
        font-variant-numeric: tabular-nums;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: var(--muted);
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/build/three.module.min.js",
          "three/addons/": "./vendor/three/examples/jsm/",
          "lil-gui": "./vendor/lil-gui/lil-gui.esm.min.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="loading">loading scene…</div>
    <div id="hud">
      <div id="clock"></div>
      <div id="stats" class="muted"></div>
      <div id="perf" class="muted"></div>
      <div id="legend"></div>
      <div id="info" class="muted">click a neuron for details · drag to rotate · scroll to zoom</div>
    </div>
    <script type="module" src="main.js"></script>
  </body>
</html>
