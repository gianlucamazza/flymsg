name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check src tests scripts
      # unit tests on synthetic networks plus the browser-module tests (node --test);
      # the full validation battery needs the ~1.1 GB connectome and is marked slow
      - run: uv run pytest
