name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to 26 from 2026-10-19
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - uses: actions/setup-node@v7
        with:
          node-version: "24"  # LTS
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check src tests scripts
      # unit tests on synthetic networks plus the browser-module tests (node --test);
      # the full validation battery needs the ~1.1 GB connectome and is marked slow
      - run: uv run pytest
