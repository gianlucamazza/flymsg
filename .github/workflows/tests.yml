name: tests

on:
  push:
    branches: [main]
  pull_request:

# actions are pinned to commit SHAs (version in the comment)
jobs:
  test:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to 26 from 2026-10-19
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # tests compare a lock with an earlier tagged version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"  # LTS
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check src tests scripts
      - run: npx --yes prettier@3.8.1 --check "**/*.md"  # docs formatting
      # unit tests on synthetic networks plus the browser-module tests (node --test);
      # the full validation battery needs the ~1.1 GB connectome and is marked slow
      - run: uv run pytest
