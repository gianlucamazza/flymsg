# Keeps the SHA-pinned actions and the locked Python dependencies current (monthly PRs).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      version-updates:
        applies-to: version-updates
        patterns: ['*']
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    groups:
      version-updates:
        applies-to: version-updates
        patterns: ['*']
