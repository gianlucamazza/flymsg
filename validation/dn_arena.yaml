yaml_subset: 2
evidence: none
evidence_none: "A synthetic milestone (DN-arena ADR): no recording is scored and validation/evidence.yaml is not edited by any arena step. The sources behind the decoder's sign and the gain envelope are cited under decoder.sources and in docs/leads.md."
issue: 263
claim:
  scored: false
  text: "On the full MaleCNS v1.0 connectome in a closed loop with a kinematic planar body, an engineered descending-neuron readout and an engineered photoreceptor drive from a lateral dark sphere: does the intact graph's change in yaw over the locked window lie outside the range of 39 degree-preserving shuffles of the same graph, at every cell of the gain envelope? A yaw change outside that range is a synthetic difference, not a biological or connectome-derived mechanism."
seen_before_lock: "Nothing of this protocol has run on the full connectome before this lock. Engineering checks were run on toy networks only (tests). Two timing smoke runs of the intact arm at the first cell (yaw 0.5 deg/s per Hz, forward 0.05 mm/s per Hz) were made on the full connectome, one under cProfile and one without, for wall time and memory only (unprofiled: build 3 s, arm 12 s, record store 11 s, peak 2.2 GB; the two gzipped records had the same size); their spikes, commands and heading were not read, and their records were deleted unread. Sources: Rayshubskiy et al. bioRxiv v4 and Yang et al. bioRxiv v1 were read in full text for the quotes below; Chen et al. 2018 could not be opened and is not cited."
model:
  dataset: malecns
  params: "sim.Params() defaults"
  neural_us: 100
  body_us: 1000
  control_us: 10000
  latency_us: 0
  duration_us: 1000000
  input_gap_steps: 22
  input_gap_from: "round(Params.t_ref / Params.dt): the input dead time of song and gf_looming, so an input cannot fire faster than its refractory period"
body:
  source: "flymsg.arena kinematic planar body (DN-arena ADR)"
  z_m: 0.0
  roll_rad: 0.0
  pitch_rad: 0.0
  evidence: synthetic
eye:
  registration: "test-only identity, eyemap frame = body frame; no sourced registration exists (#179)"
  registration_evidence: unmapped
  mounts: "pose.flygym_eye_mounts(): FlyGym 2.1.0 NeuroMechFly vision cameras"
  acceptance_deg: 8.23
  acceptance_from: "Gonzalez-Bellido, Wardill & Juusola 2011, PNAS 108:4224, Fig 3A (as in validation/t4t5.yaml)"
stimulus:
  sphere: lateral
  center_xy_m: [0.0, 0.01]
  center_z: "the mean world height of the two eye mounts at reset"
  center_rule: "y +10 mm is the fly's left at heading 0; static in the world"
  radius_m: 0.002
  evidence: engineered
transducer:
  inputs: "every photoreceptor (R1-R6, R7, R8) that eye.photoreceptors assigns to a column with a viewing direction, both eyes"
  rate_full_light_hz: 100.0
  rate_rule: "rate = rate_full_light_hz * (1 - coverage of its column); a dark sphere lowers it"
  rate_from: "the 100 Hz Poisson stimulus of every flymsg protocol, as validation/t4t5.yaml version 1 states; photoreceptor transduction has no measured value for a spiking model"
  evidence: engineered
decoder:
  neurons:
    - "10442 DNa01 L"
    - "10760 DNa01 R"
    - "523769 DNa02 L"
    - "10360 DNa02 R"
    - "13805 oDN1 L"
    - "230783 oDN1 R"
  neurons_from: "docs/dn-arena-inventory.md (MaleCNS v1.0 annotation table, sha256 2177e246113e4cfbf1e7772ec37c6da1955ff22e8063d0b1f833101f99a9a3b2); oDN1 is MaleCNS type DNg97"
  yaw_rule: "yaw rad/s = g_yaw * ((DNa01 L - DNa01 R) + (DNa02 L - DNa02 R)) spikes/s; positive yaw turns left (counterclockwise about world z)"
  forward_rule: "forward m/s = g_forward * (oDN1 L + oDN1 R) spikes/s"
  sign_from: "ipsilateral steering: 'Both cells are depolarized just before the fly steers in the ipsilateral direction' (Rayshubskiy et al., bioRxiv 10.1101/2020.04.04.024703 v4, Fig 1D legend); 'the cell with a soma in the right hemisphere was more active during right turns, and vice versa' (Yang et al., bioRxiv 10.1101/2023.10.15.562426 v1, Fig 2A)"
  linear_from: "'rotational velocity was consistently related to the difference in right-left firing rates' and 'This relationship was essentially linear through its entire dynamic range' (Rayshubskiy et al. v4, Fig 3B-C)"
  yaw_gain_deg_s_per_hz: [0.5, 2.0, 8.0]
  forward_gain_mm_s_per_hz: [0.05, 0.2]
  gains_from: "engineered envelope: no source states a numeric gain (Rayshubskiy et al. fit a slope m per cell, Fig 2F, without printing it) and no source gives an oDN1 rate against speed (Sapkal et al. 2024). The yaw grid spans a factor 16, the same gain for DNa01 and DNa02 (no measured ratio); Yang et al. v1 Fig 1C bins turning peaks at 20-200 deg/s. Gains are not evidence and do not enter validation/evidence.yaml"
  window_us: [0, 1000000]
  evidence: engineered
arms: [intact, disconnected, shuffled, replay, silenced]
silenced: "the six decoder neurons"
shuffled: "closedloop.run's shuffled arm: the open-loop samples of the body held at its reset pose, in an order permuted with seed + 1 (7001). With a static sphere every sample sees the same scene, so this arm receives the disconnected arm's stimulus and, with the shared Poisson seed, its input counts: it is expected to equal the disconnected arm, is reported, and does not enter the verdict"
controls:
  wiring_null:
    seed0: 7100
    seeds: 39
    rule: "wiring.shuffle_targets on the MaleCNS edges before building the runtime; the intact loop otherwise, at every cell"
  script:
    rule: "yaw +100 deg/s toward the eye with the larger summed coverage (left positive), 0 when equal; forward 10 mm/s; from the previous control tick's sample"
    evidence: synthetic
seed: 7000
score:
  metric: "change in unwrapped heading (rad) from 200000 to 1000000 us"
  window_us: [200000, 1000000]
  per_cell: "null if the intact change lies within the minimum and maximum of the 39 wiring-null changes at that cell (inclusive); difference otherwise"
  envelope: "robust: <verdict> when every cell has the same verdict; depends otherwise"
  reported: "per cell: intact, disconnected, shuffled, replay, silenced and script changes, intact minus script, the wiring-null minimum, median and maximum, spikes of the six decoder neurons per arm; replay parity is required"
no_go: "a cell is uninformative when the six decoder neurons fire no spike in its intact arm: the readout is then zero and the comparison empty. The envelope verdict is uninformative when every cell is"
data_rule: "a null, a difference or an uninformative outcome is archived as it is and not rerun with new gains, geometry or seeds"
limits:
  - "Synthetic: every component carries its status from the DN-arena ADR evidence table; a biological run still refuses."
  - "Spiking photoreceptors driven by Poisson rates; the graded eye of t4t5 versions 2-4 is not in this loop (DN-arena ADR, Decision 3)."
  - "Eyemap to body registration is a test-only identity (#179); eye mounts are NeuroMechFly's."
  - "A planar kinematic body: no legs, no physics, no flight."
  - "One stimulus geometry, one Poisson seed and one duration."
defaults_changed: false
