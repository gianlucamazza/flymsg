  latency_us: 0
  duration_us: 1000000
  input_encoding: kick_equivalent
  input_encoding_from: "graded eye ADR Decision 1: the photoreceptor drive is the real-valued kick-equivalent of T4/T5 version 4, no Poisson draw; the input dead time does not apply (input_gap_steps 0)"
