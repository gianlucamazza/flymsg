evidence: none
evidence_none: "A synthetic milestone (DN-arena ADR, graded eye ADR): no recording is scored and validation/evidence.yaml is not edited. The sources behind the decoder's sign are cited under decoder and in docs/leads.md; the graded pathway's sources are those of validation/t4t5.yaml version 4."
issue: 263
claim:
  scored: false
  text: "On the full MaleCNS v1.0 connectome in a closed loop with a kinematic planar body, an engineered descending-neuron readout and the graded visual pathway of T4/T5 version 4 driven by a lateral dark sphere: does the intact graph's change in yaw over the locked window lie outside the range of 39 degree-preserving shuffles of the same graph, at every configuration of the pathway envelope? A yaw change outside that range is a synthetic difference, not a biological or connectome-derived mechanism."
seen_before_lock: "Version 1 of this lock ran (results/dn-arena/v1, docs/result/dn-arena.md): uninformative, the six decoder neurons silent at every cell; a post-verdict exploratory count found only the input photoreceptors active, all their output synapses inhibitory. That outcome motivates this version and was read before it. T4/T5 version 4 (results/t4t5/v4) was read: robust neither, T4 firing only at medulla release 200 Hz; the configurations below are chosen from that reading and say so. Nothing of this version's graded closed loop has run on the full connectome before this lock except the timing smoke runs named in smoke, whose spikes, commands and heading were not read and whose records were deleted unread."
smoke: "Timing only, on the full connectome, with this lock's code at the gain 16 configuration: setup 5 s; intact pathway with 6 dark passes 160 s; one intact 1 s arm 156 s; record serialization 43 s (839 MB of JSON); a wiring-null pathway on a shuffle with seed 1, outside the locked seeds, 97 s; peak memory 4.4 GB per process. An earlier attempt stopped after the pathway (102 s) on an invalid execution id. No spike, command or heading was read and no record was kept. Estimated cost of the counted run: about 3 h with 4 workers."
