# T4/T5 direction selectivity through the eye (issues 84, 97, 140). Version 4, fixed
# 2026-10-14 after the v3 run and before any v4 run. Version 1 is the file at 0c574f5,
# version 2 at 1ea7cd9 (run from 17173c2), version 3 at 406f622.
# Changing a locked field requires incrementing `version` and updating `content_sha256` and
# flymsg.t4t5.VERSION_HASHES. `flymsg t4t5` prints this file.
