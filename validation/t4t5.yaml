# T4/T5 direction selectivity through the eye (issues 84, 97, 140). Version 3, fixed
# 2026-10-13 after the v2 run and before any v3 run. Version 1 is the file at 0c574f5,
# version 2 at 1ea7cd9 (run from 17173c2).
# Changing a locked field requires incrementing `version` and updating `content_sha256` and
# flymsg.t4t5.VERSION_HASHES. `flymsg t4t5` prints this file.
version: 3
content_sha256: 84b3c1edfad1417b7cc78ad14d1e07310d3fdfec4b6c72d5e6fe130fc03e8f54

issue: 140
supersedes:
  version: 2
  verdict: "robust: neither"
  reason: "With graded photoreceptors and L1-L3, contrast crossed the lamina (L1-L3 hyperpolarized 14-33 mV under light) but stopped in the medulla: Mi1, Tm3 and Mi4 never fired and no T4 or T5 neuron spiked in any of 17 configurations. In the fly Mi1, Tm3, Mi4, Mi9 and C3 are non-spiking, and their voltages to the same 30 deg/s edges are deposited (Groschner et al. 2022). Version 3 makes these five T4 inputs graded with release spanning their measured voltages; T5's inputs (Tm1, Tm2, Tm4, Tm9) have no measured voltage in mV and stay as in version 2, so version 3 decides on T4 only."
question: "With graded photoreceptors and L1-L3 as in version 2 and T4's medulla inputs Mi1, Tm3, Mi4, Mi9 and C3 graded over the voltages measured in vivo, do the four T4 subtypes respond more to ON than to OFF edges and with their measured preferred directions, and does the answer hold over the unmeasured release rates?"

prior: "Lappalainen et al. 2024 (doi:10.1038/s41586-024-07939-3, Fig 2d): untrained connectome models with signs predict contrast preference well but direction selectivity poorly. Polarity is expected if contrast crosses the lamina; direction is the open question. The medulla neurons downstream of the lamina (Mi1, Tm3, Mi4, Mi9, Tm1, Tm2, Tm4, Tm9) stay spiking and silent at rest, so disinhibition alone may not reach them."

seen_before_lock: "Versions 1 and 2 (results/t4t5/v1, seeds 90-92; results/t4t5/v2, seed 93, 17 configurations, robust: neither, with spikes per pathway type). Before this lock the Groschner et al. 2022 traces were read (cell counts, mean dark potential, lowest and highest mean values per type, the photodiode trace and the authors' notebook) and Behnia et al. 2014, Kohn et al. 2021 and Yang et al. 2016 were read for OFF-pathway voltages (none in mV). An engineering smoke run of the v3 code (first configuration, 0.3 deg of travel, 10 ms settle) was checked for output shapes only; no full-length moving edge has been run with graded medulla neurons."

sources:
  subtypes: "Maisak et al. 2013, Nature, doi:10.1038/nature12320: T4 respond to ON edges, T5 to OFF edges; subtypes a-d prefer front-to-back, back-to-front, upward, downward (Shinomiya et al. 2019, eLife 8:e40025, Fig 3B)"
  dsi: "Haag, Mishra & Borst 2017, eLife (PMC5582866), Fig 4c-d: DSI about 0.8 in calcium for gratings and edges; gratings at 30 deg/s"
  acceptance: "Gonzalez-Bellido, Wardill & Juusola 2011, PNAS 108:4224, Fig 3A: acceptance angle 8.23 deg (FWHM, Gaussian)"
  graded_photoreceptors: "Juusola, Dau, Zheng & Rien 2016, JoVE 112:54142, doi:10.3791/54142: Drosophila R1-R6 in vivo rest near -65 mV and depolarize 40-65 mV to light"
  graded_lmc: "Juusola et al. 2016 (as above): Drosophila LMCs rest at -30 to -50 mV and hyperpolarize 20-45 mV to light; Zheng et al. 2006, J Gen Physiol 127:495, doi:10.1085/jgp.200509470: LMC transients up to 45 mV, both cell classes non-spiking"
  no_release_curve: "No Vpre -> release or Vpre -> Vpost relation is measured in Drosophila (audit 2026-10-13, issue 97); the only measured R -> LMC curve is from Calliphora"
  medulla_voltages: "Groschner, Malis, Zuidinga & Borst 2022, Nature 603:119, doi:10.1038/s41586-022-04428-3 (CC BY 4.0), Fig 3a; data Edmond doi:10.17617/3.8G v1.0 (CC BY 4.0), fig3_<type>.npy: in vivo whole-cell potentials (mV, 1 kHz, -1 pA holding) of Mi1 (24 cells), Tm3 (12), Mi4 (19), Mi9 (29) and C3 (16) to 30 deg/s ON and OFF edges; no type is reported to spike"
  medulla_timing: "Behnia et al. 2014, Nature 512:427, doi:10.1038/nature13427, Fig 3B and 3E: whole-cell peak response times Mi1 71 ms (SEM 3.8) vs Tm3 53 ms (SEM 5.2), Tm1 56 ms (SEM 3.8) vs Tm2 43 ms (SEM 2.7) to Gaussian flicker; graded responses"
  off_voltages: "No resting potential or response in mV for Tm1, Tm2, Tm4 or Tm9: Behnia et al. 2014 give figure axes only, Kohn et al. 2021 (Curr Biol, doi:10.1016/j.cub.2021.09.061) normalized responses, Yang et al. 2016 (Cell) and the calcium-imaging studies no mV"
  lmc_types: "L1 glutamatergic, L2 and L3 cholinergic in MaleCNS; L1 feeds the ON pathway (Mi1, Tm3), L2 and L3 the OFF pathway (Tm1, Tm2, Tm4, Tm9) (Shinomiya et al. 2019)"

protocol:
  speed_deg_s: 30.0
  window_deg: 30.0
  window_note: "columns within 30 deg of each eye's median viewing direction; each eye is stimulated in its own frame; photoreceptors outside the window stay dark"
  travel_deg: 60.0
  settle_ms: 200.0
  settle_note: "the edge's first frame is held for settle_ms before it moves, so graded neurons reach steady state; spikes are counted only while the edge moves"
  acceptance_deg: 8.23
  directions: [front_to_back, back_to_front, upward, downward]
  polarities: [on, off]
  seed: 94
  seed_note: "the input is deterministic (graded light, no Poisson draw), so one run per stimulus and configuration; the seed is recorded and draws nothing"
  subtypes: [T4a, T4b, T4c, T4d, T5a, T5b, T5c, T5d]
  preferred:
    a: front_to_back
    b: back_to_front
    c: upward
    d: downward
  graded_photoreceptors: "every photoreceptor type of flymsg.eye.RECEPTORS (R1-R6, R7*, R8*)"
  graded_lmc: [L1, L2, L3]
  graded_medulla: [Mi1, Tm3, Mi4, Mi9, C3]
  medulla_mv:
    Mi1:
      n: 24
      dark: -65.2
      lowest: -69.2
      highest: -41.3
    Tm3:
      n: 12
      dark: -64.4
      lowest: -69.4
      highest: -42.5
    Mi4:
      n: 19
      dark: -65.1
      lowest: -66.7
      highest: -52.3
    Mi9:
      n: 29
      dark: -58.0
      lowest: -62.5
      highest: -50.4
    C3:
      n: 16
      dark: -66.8
      lowest: -74.0
      highest: -46.9
  medulla_mv_from: "flymsg.medulla.ranges: per type, the mean over cells of each sweep; dark is the mean of the first second of the ON sweep (darkness, before the edge), lowest and highest the extremes of the two mean sweeps; rounded to 0.1 mV; the run recomputes them from the sha256-pinned files and stops if they differ"
  medulla_curve: "release 0 at v_rest - (dark - lowest), saturated at v_rest + (highest - dark): the model's rest stands for the measured dark potential, so the release a type has in darkness is the measured share of its range below the dark level"
  photoreceptor_curve: "release 0 at rest (v_rest) rising linearly to saturation at v_rest + photoreceptor_response_mv; the light gain is set so that full light holds a photoreceptor at that depolarization (steady state of the membrane equation, photoreceptor input only)"
  lmc_curve: "release half-saturated at rest, 0 at v_rest - lmc_hyperpolarisation_mv, saturated at v_rest + lmc_hyperpolarisation_mv (tonic, symmetric about rest)"
  photoreceptor_rate: "set so that full light on the window hyperpolarizes by lmc_hyperpolarisation_mv the median L1-L3 among those receiving synapses from window photoreceptors, at steady state, counting photoreceptor input only"
  envelope:
    photoreceptor_response_mv: [40.0, 52.5, 65.0]
    lmc_hyperpolarisation_mv: [20.0, 32.5, 45.0]
    lmc_rate_hz: [25.0, 50.0, 100.0, 200.0, 400.0]
    medulla_rate_hz: [25.0, 50.0, 100.0, 200.0, 400.0]
    grid: "every lmc_rate_hz x medulla_rate_hz at photoreceptor_response_mv 52.5 and lmc_hyperpolarisation_mv 32.5: 25 configurations"
    ranges_from: "photoreceptor and LMC ranges as version 2 (their midpoints; version 2's verdict did not depend on them); medulla voltages measured (medulla_mv); lmc_rate_hz and medulla_rate_hz have no measurement and span four doublings around the 100 Hz input rate of every flymsg protocol"

compensations:
  - "The release curve is threshold-linear with endpoints at the measured voltage ranges; its shape is not measured in Drosophila."
  - "LMC release is symmetric about rest; the depolarizing range above rest is not measured separately."
  - "The LMC release rate at saturation (lmc_rate_hz) is not measured; it is scanned, not chosen."
  - "Photoreceptor depolarization is linear in light, without adaptation or the log compression of real photoreceptors; rest is darkness."
  - "Only photoreceptors assigned to a column with a viewing direction are driven; about a third of cartridges receive light."
  - "Point neurons with one time constant: direction selectivity in the fly relies on delay differences between inputs (Mi1/Tm3 against Mi4/Mi9; Behnia et al. 2014 measure 18 ms between Mi1 and Tm3) that the model does not set per type."
  - "The medulla release curve is threshold-linear between the lowest and highest mean potentials measured to edges, anchored at the model's rest for the dark potential; the mean traces are under -1 pA holding current, and their extremes understate single-cell ranges."
  - "Tm1, Tm2, Tm4, Tm9 and every type other than photoreceptors, L1-L3 and the five graded medulla types stay spiking; T4 and T5 are counted by spikes, while in the fly they respond mostly in graded potentials."
  - "CT1 is one point neuron per side; in the fly it is compartmentalised per column."
  - "The left eye is the right eye mirrored; spike counts are compared with calcium measurements."

decides:
  subtypes: [T4a, T4b, T4c, T4d]
  polarity: "per configuration: every T4 subtype fires more, summed over directions, to ON than to OFF edges"
  direction: "per configuration: for at least 3 of the 4 T4 subtypes, the vector sum of responses to ON edges points within 45 deg of the measured preferred direction"
  verdict: "per configuration: both, polarity only, direction only, or neither"
  envelope_verdict: "robust: <verdict> if all 25 configurations give the same verdict; otherwise depends, with the count of configurations per verdict"

reported:
  dsi:
    decides: false
    what: "DSI = (R_PD - R_ND) / (R_PD + R_ND) per subtype and configuration, next to the 0.8 measured in calcium"
  pathway:
    decides: false
    what: "spikes per type of the lamina-to-T4/T5 pathway (Mi1, Tm3, Mi4, Mi9, Tm1, Tm2, Tm4, Tm9, T4, T5) per configuration and stimulus, to locate where the signal stops"
  t5:
    decides: false
    what: "the version 2 polarity and direction checks for the four T5 subtypes, whose inputs are unchanged"
  medulla_voltage:
    decides: false
    what: "potential of each graded medulla type relative to rest: median at the end of the settle period, lowest and highest bin mean of the type median during motion, next to the measured range below and above the dark level"
  lmc_voltage:
    decides: false
    what: "potential of the L1-L3 receiving synapses from window photoreceptors: median at the end of the settle period, lowest and highest bin mean during motion, next to the measured 20-45 mV"

defaults_changed: false
