# Synapse weight: count against density on measured PN -> LHN unitary EPSPs (issue 139).
# Version 1, fixed 2026-10-13 before any MaleCNS count or area between these neurons was
# computed. Changing a locked field requires incrementing `version` and updating
# `content_sha256` and flymsg.weight_rule.VERSION_HASHES. `flymsg weight-rule` prints it.
version: 1
content_sha256: 87a33e5fbc589f4445386618275c46bf88c18d7f97d46e1b02e82ff4535ef79d
issue: 139
question: "Across measured PN -> LHN unitary EPSPs, does the MaleCNS synapse count onto a neuron rank the amplitudes better or worse when divided by the postsynaptic surface area (density) than when used as it is (count)?"
seen_before_lock: "Liu et al. 2022's Table S3 in full (156 pairs: 29 measured, 106 at 0 mV, 21 omitted), their Table S2 (hemibrain types per LHN), and in MaleCNS only which PN and LHN types exist and how many neurons each has. No MaleCNS synapse count between these PNs and LHNs, no surface area of these LHNs and no correlation of anything with the amplitudes has been computed. Liu et al. report a density fit (r2 0.77 over 135 pairs) and no count-only statistic."
sources:
  physiology: "Liu, Davoudian, Lizbinski & Jeanne 2022, Curr Biol 32:559, doi:10.1016/j.cub.2021.11.056, Table S3 (Document S1, https://ars.els-cdn.com/content/image/1-s2.0-S0960982221016420-mmc1.pdf, sha256 f7c693deb13c8f7522a0ee58cd39e703d40661ee3c59fd090f2cc08a85afbf28): mean somatic uEPSP per PN-LHN pair, 0 mV where no response was evident"
  types: "Liu et al. 2022 Table S2 (mmc2.xlsx, https://ars.els-cdn.com/content/image/1-s2.0-S0960982221016420-mmc2.xlsx, sha256 c1797bb29fa7aa2a9617b623aabf0e6debf453c4b35fd4b1005a22f6bede4e87): hemibrain type(s) of each LHN name"
  licence: "Elsevier open archive (user licence); values transcribed here with their source, the file is not redistributed"
  pn_rule: "one uniglomerular PN of the anterodorsal or lateral lineage per glomerulus, as in Liu et al.; DM1 and VC1 are lPN, the others adPN"
protocol:
  pn_types: [DA4l_adPN, DC1_adPN, DL4_adPN, DL5_adPN, DM1_lPN, DM4_adPN, DP1m_adPN, VA2_adPN, VA6_adPN, VC1_lPN, VL2a_adPN, VL2p_adPN]
  count: "per pair and side: mean over the LHN neurons of the type on that side of the summed synapse count from the glomerulus's PN on that side; then the mean over the sides that have both"
  area: "per LHN type: mean surface area of its neurons' published MaleCNS meshes at full resolution (scripts/mesh_area.mjs), fetched before the run into data/weight_rule/areas.csv"
  rules:
    count: "prediction = count"
    density: "prediction = count / area"
  statistic: "Spearman rank correlation (average ranks for ties) of prediction against uEPSP, for each rule"
  difference: "delta = rho_density - rho_count, with a 95% percentile interval from 10000 paired bootstrap resamples of the pairs"
