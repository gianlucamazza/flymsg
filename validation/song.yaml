issue: 36
claim:
  kind: held_out_benchmark
  scored: true
  what: "Per central-brain neuropil of male flies, the sign of the preference for pulse over sine song (Pacheco et al. 2021), predicted by the connectome driven through Johnston's organ with a temporal-only input."
  scope: "The envelope-driven part of song selectivity only: the model has no carrier frequency, so selectivity that arises from frequency tuning early in the pathway (Baker et al. 2022; Azevedo & Wilson 2017) is outside the claim, and white noise is not scored."
  held_out: "Pacheco et al. 2021's responses were never used to build, calibrate or tune flymsg; the data file is opened only after the model runs and its no-go check."

seen_before_lock: "The dataset's structure only: timestamps, stimulus index vector, stimulus, sex and neuropil names, fly and ROI counts per neuropil and sex. No response value of any ROI has been read, summarised or plotted. Yamakoshi et al. 2025's raw traces were read to check their pipeline reproduces the authors' fitted file (one fly); no ratio was computed."

