drive:
  types: [JO-A, JO-B, JO-D]
  type_regex: "^JO-[ABD]"
  sides: both
  neurons: 146
  why: "JO-A, JO-B and JO-D respond at song frequencies (Pacheco et al. 2021; Kamikouchi et al. 2009; Matsuo et al. 2014); JO-C and JO-E respond to static deflection. Annotations ending in -unclear keep their subgroup."
  equal_kicks: "kicks pass a dead time of one refractory period (sim.Params.t_ref), then each neuron's kicks are subsampled to its smallest count across the three conditions, so every JO neuron gets the same number of kicks in pulse, sine and aperiodic; one kick (about 48 mV) fires a JO neuron at rest, but its spikes also depend on recurrent input, so spikes are reported, not forced equal"
  equal_mean_rate: "pulse and aperiodic kicks arrive at rate / duty during a pulse and none in a pause; sine at rate throughout"

stimulus:
  pulse_ms: 16.0
  pause_ms: 20.0
  train_ms: 10000.0
  source: "Pacheco et al. 2021, Supplementary Table 2, coarse tuning protocol (Pslow): 16 ms pulses, 20 ms pauses, 10 s trains; sine 150 Hz, 10 s"
  aperiodic: "the pulse train's number of pulses placed uniformly at random in the same 10 s with at least aperiodic_min_gap_ms between them: pulses without a period (and with irregular gaps)"
  aperiodic_min_gap_ms: 4.4
  aperiodic_min_gap_why: "two refractory periods (2 x sim.Params.t_ref), so no two pulses fuse into one longer pulse for a JO neuron"

grid:
  rates_hz: [50.0, 100.0, 200.0]
  decision_rate_hz: 100.0
  rate_why: "JO firing rates to song are not measured; the mean per-neuron rate is a free gain, scanned over 50, 100, 200 Hz (the battery's 100 Hz in the middle); the verdict is taken at 100 Hz and the other two are reported"
  seed0: 360
  seeds: 5
  seeds_why: "the convergence and sensitivity locks' five seeds; a neuropil's sign is the seed median"
  shuffles: 99
  shuffles_why: "the smallest empirical p is 1/100, below alpha, so the shuffle test is not passed by its floor alone"
  shuffle_seed0: 3600
  duration_ms: 12000.0
  bin_ms: 100.0

