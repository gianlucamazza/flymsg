score:
  excluded: [AMMC, SAD, WED, GNG]
  excluded_why: "receptor-near: JO axons project there and their pulse/sine sign is set by which JO subgroup stands for which song, not by the circuit; MaleCNS also has no AMMC outside SAD in primary regions"
  model_activity: "per neuropil, the spike counts over the 12 s run (10 s train and 2 s after, the paper's window) summed over neurons weighted by each neuron's synaptic connections in that neuropil (pre and post, MaleCNS primary_post, left and right pooled); the driven JO neurons are left out"
  model_index: "(pulse - sine) / (pulse + sine) per seed; the prediction is the sign of the seed median (0 where silent); a neuropil is resolved when every seed has that nonzero sign (used by the no-go only)"
  data_index: "per male ROI the paper's magnitude for pulse and for sine, (pulse - sine) / (pulse + sine); the median over each fly's ROIs, then per neuropil the sign shared by the flies"
  scored_set: "every scorable neuropil with a data sign; the real model, each shuffled connectome and the aperiodic train are scored on this same set by the same rule, and a sign 0 counts as wrong for all"
  min_scored: 8
  min_scored_why: "a quarter of the 32 scorable neuropils; with fewer, balanced accuracy moves by a whole neuropil's share"
  statistic: "balanced accuracy of the model's sign against the data's (mean recall over pulse- and sine-preferring neuropils), so a constant prediction scores 0.5"
  permutations: 10000
  permutation_seed: 36
  alpha: 0.05
  verdict:
    pass: "permutation p <= alpha (model signs permuted over the scored neuropils), degree-preserving shuffle p <= alpha (balanced accuracy of 99 shuffled connectomes, pulse vs sine, same seeds and rule) and higher balanced accuracy than the aperiodic train against sine"
    pass_burst_only: "both p <= alpha but the aperiodic train predicts as well: pulses matter, their period does not"
    fail: "otherwise"
    uninformative: "fewer than min_scored neuropils, a single data class, or the no-go"

no_go:
  min_resolved_share: 0.5
  rule: "computed on the model only, before the data file is opened: if fewer than half of the scorable neuropils resolve a sign over seeds at the decision rate, or the resolved ones are all pulse- or all sine-preferring, the run stops and is recorded as uninformative"
  why: "LIF neurons with no intrinsic band-pass may smooth a 27.8 Hz envelope away, and a constant prediction cannot beat balanced accuracy 0.5; the test is meaningful only if the model distinguishes the conditions in both directions"
  min_resolved_share_why: "a majority of neuropils must carry a model sign that is not seed noise"
  not_a_no_go: "pulse against the aperiodic train is scored (pass against pass_burst_only), not a no-go"

data_rule:
  signal: median_z_scored_signal_per_roi
  baseline_s: [-4.0, -0.5]
  window_s: [0.0, 12.0]
  high_percentile: 80
  low_percentile: 20
  block_before: 20
  block_len: 61
  min_flies: 4
  min_fly_share_num: 2
  min_fly_share_den: 3
  min_fly_share_why: "the project's holds share (two thirds of seeds, here of flies); fewer flies agreeing leaves the neuropil without a sign"
  percentile: "numpy linear interpolation; MATLAB prctile interpolates differently, a difference below one sample at 25 samples per window"
  sex: Male
  neuropil_index: "1-based into neuropil_full_names; 0 is a ROI outside every neuropil (41 names, values 0 to 41)"
  source: "Pacheco et al. 2021 Methods (response magnitude: baseline -4 to -0.5 s, onset to 2 s after offset, 80th or 20th percentile of the baseline-subtracted signal whichever is larger in absolute value; neuropils counted with at least 4 flies). Z-scoring is linear per ROI, so the pulse/sine ratio is the same on dF/F (assumed per ROI over the recording, not per trial or stimulus; the readme does not say)."

secondary:
  decides: false
  what: "the same model with JO-A and JO-B weighted by their measured response ratio: in each condition the weaker subgroup's kicks are thinned so that A/B equals the median over control flies of JO-A peak / JO-B peak (Yamakoshi et al. 2025, Fig 3); pulse from the 35 ms IPI pulse song, sine from the 100 Hz tone; JO-D untouched; at the decision rate"
  pulse_column: IPI35
  sine_column: 100Hz
  control_flies: 11
  baseline_frames: [1, 19]
  fit_after_frame: 61
  stimulus_frames: [21, 40]
  compensations: "virgin females, a pan-JO driver with JO-A and JO-B separated by two ROIs on the axon bundle in the AMMC, a 167 Hz pulse carrier against Pacheco's 250 Hz, a 100 Hz tone for a 150 Hz sine, GCaMP6f peaks as a proxy for rates; equal kicks across conditions no longer hold"

limits:
  - "Temporal-only input: no carrier frequency, so frequency-driven selectivity and white noise are out of scope."
  - "Spike counts against calcium: no GCaMP kernel; the model's 12 s count stands for the data's percentile magnitude."
  - "The model has no spontaneous activity, so its baseline is zero and inhibition below baseline is invisible; the data's magnitude counts inhibitory responses as well."
  - "Neuropil activity is a synapse-weighted sum of spike counts, a proxy for the calcium in a neuropil's neurites; left and right are pooled because the data has no hemisphere."
  - "The JO rate is a free gain, scanned at three values; the delivered rate is lower than the nominal one after the dead time and the matching, and is reported."
  - "Neuropils share neurons, so their signs are not independent; the permutation test treats them as exchangeable and overstates the effective number of neuropils, which the degree-preserving shuffles partly offset."
  - "Neuropils absent from MaleCNS primary regions (mALT, GC, WEDC, iSADC, sSADC) are not scored; MB_VL and MB_ML pool the MaleCNS lobes."
  - "The 85% selectivity rule of the paper classifies response types; the per-neuropil sign here uses the magnitudes it is built on."

defaults_changed: false
