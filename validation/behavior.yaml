# One-bit looming-jump protocol. Version 1, fixed 2026-10-11 before any closed loop.
# Changing a locked field requires incrementing `version` and updating
# `content_sha256` and flymsg.behavior.VERSION_HASHES.
# `flymsg behavior` prints this file and does not simulate.
version: 1
content_sha256: 8f7a9dd74355ed60fb156f4eda162c04a5bc9e3eb1e428320039c1b5931dab50

dataset:
  name: MaleCNS v1.0
  license: CC-BY-4.0
  neurons_traced: 165122

claim:
  status: calibration_feasibility
  held_out: false
  case: looming escape
  reason: looming escape is a v4 calibration case, so this loop does not generalize

task:
  id: one-bit looming jump
  stimulus: LC4_R
  stimulus_n: 55
  stimulus_superclass: visual_projection
  motor: TTMn_R
  motor_n: 1
  motor_superclass: vnc_motor
  command: DNp01
  command_n: 2
  command_instances:
    - DNp01(GF)_R
    - DNp01(GF)_L

body:
  name: one-bit
  state:
    - escaped
    - t_jump_ms
  timestep_ms: null

controller:
  kind: traced_lif
  learned: false

protocol:
  min_spikes: 3
  min_seed_share_num: 2
  min_seed_share_den: 3
  rate_hz: 100.0
  stim_ms: 300.0
  duration_ms: 600.0
  seeds: 3
  seed0: 0
  w_syn: 0.19230769230769232
  th_jump: 0.0
  dt_ms: 0.1

encoding:
  kind: poisson
  units: spikes per neural step
  generator: numpy default_rng(seed) for the open-loop window, then a mask
  assumed:
    - poisson_is_not_a_loom
    - lc4_class_is_missing

decoding:
  neuron: TTMn_R
  count: cumulative spikes from t = 0
  t_jump: first step whose count reaches min_spikes
  cut: steps strictly after t_jump
  assumed:
    - three_spikes_are_the_v4_floor
    - no_muscle_tension

decides:
  jump:
    deadline_ms: 300.0
    min_seed_share_num: 2
    min_seed_share_den: 3
  feedback:
    zero_after_jump: true
    match_open_loop_through_jump: true
  silence:
    neurons: DNp01
    neurons_n: 2
    max_spikes: 2
    seeds_allowed_to_jump: 0
    drive_cut: false
  decoder_match:
    neuron: TTMn_R
    through: t_jump
    equal_to: feedback_disabled

reported:
  feedback_disabled:
    decides: false
    stim_ms: 300.0
  latency:
    decides: false
    scored_against_biology: false
  stability:
    decides: false
    max_persistent: 100
  order:
    decides: false

not_scored:
  - biological_latency
  - stability
  - order
  - dose
  - specific
  - flybody_rollout
  - learned_policy

wiring:
  draw: false
  family: degree_preserving
  shuffle_seed: 0
  reason: N1 already fails the looming specific check on that one shuffle

coupling:
  neural_dt_ms: 0.1
  future_body: integer_multiple_of_neural_dt
  sensory_held_between_body_steps: true

flybody:
  selected: false
  repository: https://github.com/TuragaLab/flybody
  license: Apache-2.0
  read_on: 2026-10-11
  walking_action_dim: 59
  xml_timestep_s: 0.0001
  walk_physics_s: 0.0002
  walk_control_s: 0.002
  flight_physics_s: 5e-5
  flight_control_s: 0.0002
  legal_under_coupling:
    xml_timestep: true
    walk_physics: true
    walk_control: true
    flight_physics: false
    flight_control: true

replay:
  neural: spike-count bins and first-spike times
  sensory: masked LC4 kick matrix
  motor: escaped and t_jump_ms
  deterministic: true

prediction:
  id: gf_required_for_the_jump_bit
  status: unverified
  tests_animal: false
