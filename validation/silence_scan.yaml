# Residual TTMn_R partner scan. Version 3, fixed 2026-10-12 after the v2 run and before any v3 run.
# Version 1 (v0.8.16) ran once: verdict none. Version 2 (v0.8.27) ran once: names_partner DNp02,
# DNp06. Version 3 repeats version 2 unchanged on fresh confirm seeds. See supersedes.
# Changing a locked field requires incrementing `version` and updating
# `content_sha256` and flymsg.silence_scan.VERSION_HASHES.
# `flymsg silence-scan` prints this file and does not simulate.
version: 3
content_sha256: 8cb7434f86ec0a0c545cee50167f1130f6d4b832feb6e785ee923e9474f28a55

issue: 20
supersedes:
  version: 2
  verdict: "names_partner: DNp02, DNp06"
  reason: "Version 2 changed the null pool after the version 1 result was seen. Its rule was fixed before its own run, but it was chosen knowing v1 had missed the threshold. Version 3 repeats version 2 with every rule unchanged on confirm seeds no version has used, so no rule can have been chosen after seeing these seeds. The v2 verdict stands until this run reports."
replication:
  of_version: 2
  changed: [confirm.seed0]
  on_failure: "If a unit that version 2 named does not reach names_partner here, the v2 naming is reported as not replicated, issue #20 is reopened with both results, and neither run is dropped. If both reach it again, the naming is reported as replicated on fresh seeds; it stays a model-side result."
parent:
  lock: behavior
  version: 1
  arm: silence

question: "With both DNp01 neurons silenced and LC4_R driven, which chemical input cell type still drives TTMn_R?"

blind:
  ranking_used: false
  reason: "The 2026-10-12 listing of TTMn_R inputs was read before this lock. It names no unit here. The runner computes the candidate set from the rule below."

protocol:
  stimulus: LC4_R
  stimulus_n: 55
  motor: TTMn_R
  motor_n: 1
  base_silence: DNp01
  base_silence_n: 2
  rate_hz: 100.0
  stim_ms: 300.0
  duration_ms: 300.0
  dt_ms: 0.1
  w_syn: 0.19230769230769232
  th_jump: 0.0
  drive_cut: false
  statistic: "TTMn_R spikes during the 300 ms drive, mean over seeds"

candidates:
  unit: cell_type
  untyped: one_unit_per_neuron
  min_weight: 5
  weight: "sum of synapses from every neuron of the unit onto TTMn_R"
  active: "at least one neuron of the unit fires during the drive in at least 2 of the 3 screen seeds of the base arm"
  exclude:
    - stimulus
    - motor
    - base_silence
  sign: any
  cap: none
  silence: "every neuron of the unit except the excluded ones"

base_arm:
  silence: DNp01
  stop_if_max_spikes_at_most: 2

screen:
  seed0: 0
  seeds: 3
  null: none
  pass_fraction_of_base: 0.5
  rule: "A unit passes when the mean TTMn_R count with DNp01 and the unit silenced is at or below half of the base arm mean on the same seeds."
  decides: false

confirm:
  seed0: 30
  seeds: 3
  null: matched_responders
  pool: "neurons firing during the drive in at least 2 of the 3 confirm seeds of the base arm, minus stimulus, motor, base_silence, the tested unit and every other unit that passed the screen"
  pool_excludes_screen_passes: true
  match: [superclass, sign]
  base_silence_in_every_draw: true
  min_draws: 1000
  draws_per_test: 20
  tail: lower
  p: "(1 + number of draws whose mean count is at or below the observed mean) / (1 + draws)"
  alpha: 0.05
  correction: bonferroni_over_screen_passes
  undefined_null: reported_without_p

decides:
  contributes: "p at or below alpha / m, where m is the number of units that pass the screen"
  names_partner: "contributes, and TTMn_R emits at most 2 spikes in every confirm seed"
  none: "m is 0, or no unit contributes. The residual drive is not one cell type. No combination is searched in this version."
  no_residual: "the base arm keeps TTMn_R at or below 2 spikes in every seed of a stage. Nothing is named on those seeds."

reported:
  base_counts:
    decides: false
  screen_table:
    decides: false
  null_mean:
    decides: false
  first_spike_ms:
    decides: false
  partner_counts:
    decides: false
    what: "in each confirm arm, the spikes during the drive of every other screen pass, per seed (e.g. DNp06 when DNp02 is silenced); a description, no test"

not_done:
  - combinations
  - gap_junctions
  - retune
  - n1_redraw
  - held_out_edit
  - behavior_v1_edit

prediction:
  id: gf_required_for_the_jump_bit
  status: unverified
  tests_animal: false
