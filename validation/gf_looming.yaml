# Looming -> giant fiber timing (issue 34, gate G3). Version 1, fixed 2026-10-15 before any run.
# Changing a locked field requires incrementing `version` and updating `content_sha256` and
# flymsg.gf_looming.VERSION_HASHES. `flymsg gf-looming` prints this file; `--run` executes it.
version: 1
content_sha256: 439b00d2360727596bd42e2d18b48c7f053c46f2e35fc101c3d49ef3a2024104
yaml_subset: 2
evidence: [dombrovski_gf_looming, jang_looming_protocol]

issue: 34
claim:
  kind: held_out_benchmark
  scored: true
  what: "How long before a looming disc's virtual collision the giant fiber (DNp01) peaks, as a function of r/v: by a threshold-angle model the time is alpha * r/v - delta, and alpha = 1 / tan(theta_thr / 2) fixes the angular size the response follows. Predicted by the connectome with LC4 and LPLC2 driven by engineered transducers, against the giant fiber's whole-cell recordings (Dombrovski et al. 2025)."
  scope: "Timing only. No amplitude is scored: the LIF's millivolts are not the recorded ones, and the transducer gains are not measured, so they are scanned as an envelope and never chosen."
  held_out: "The recordings were never used to build, calibrate or tune flymsg; the files are downloaded after this lock is merged and opened only after the model has run and passed its no-go."

seen_before_lock: "During the 2026-10-14 literature search an agent opened one control file (DipE_Null_cont_fly22_trial01.mat: 80000 x 4, resting about -73 to -76, peak minus baseline 4.7 to 7.1 over the four r/v, units assumed mV) and noted that its peak timing is consistent with a 10 to 63 degree disc (no peak time was recorded); it also opened the deposited xlsx (r/v column order, 20 kHz, stimulus at 2 s, per-fly values behind Fig. 3 and Extended Data Fig. 8) and the structure of the Fig. 1 file. No other file was opened. The scored quantity is the slope of peak time over r/v across ten flies; the amplitudes seen do not enter it."

