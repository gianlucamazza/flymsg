stimulus:
  rv_ms: [10.0, 20.0, 40.0, 80.0]
  start_deg: 10.0
  end_deg: 63.0
  size: "full angular size theta: tan(theta / 2) = (r/v) / t_to_collision (flymsg.eye.looming_radius_deg gives theta / 2); the disc expands from start_deg to end_deg and then holds; the virtual collision lies (r/v) / tan(end_deg / 2) after the end of the expansion"
  source: "Jang et al. 2023 (10 to 63 degrees, then held for 1 s; r/v 10, 20, 40, 80 ms), the protocol Dombrovski et al. 2025 cite for these recordings; inferred for them"

drive:
  lc4_type: LC4
  lc4_neurons: 126
  lplc2_type: LPLC2
  lplc2_neurons: 185
  sides: both
  sides_why: "the recorded side and the disc's azimuth in the 2025 runs are not stated"
  lc4_rate: "g4 * dtheta/dt, dtheta/dt in rad/s"
  lplc2_rate: "g2 * theta, theta in rad"
  forms_why: "Ache et al. 2019 (abstract): the giant fiber follows 'a linear function of angular velocity (provided by LC4) and a Gaussian function of angular size (provided by LPLC2)'; the Gaussian's parameters were not read from the paper, so size enters linearly; neither is a measured LC4 or LPLC2 spike rate"
  cap_rule: "every rate is capped at 1000 / sim.Params.t_ref Hz, the most one LIF neuron can fire"
  g4_hz_per_rad_s: [0.0, 2.0, 5.0, 10.0]
  g2_hz_per_rad: [0.0, 50.0, 100.0, 200.0]
  grid_why: "engineered envelope: LC4 and LPLC2 spike rates to looming are not measured (docs/leads.md, G3). At r/v 10 ms dtheta/dt reaches about 55 rad/s at 63 degrees, so g4 spans no input to the cap; theta reaches 1.1 rad, so g2 spans no input to about 220 Hz. The cell with both gains 0 has no input and is left out: 15 cells."
  kicks: "per neuron and neural step, Poisson counts at the rate of that step (as song.matched_kicks, without matching); one kick is about 48 mV"

model:
  pre_ms: 200.0
  post_ms: 150.0
  post_why: "the window ends 150 ms after the expansion stops (Dombrovski et al. 2025 score 150 ms after onset in their Fig. 1); a later peak is no longer driven by expansion"
  seed0: 340
  seeds: 5
  readout: "the mean membrane potential of DNp01(GF)_R and DNp01(GF)_L at every neural step (CpuRuntime.read), a step where one fires counted at v_th for that neuron; baseline the mean over pre_ms; the peak is the first maximum in the window from onset to the end of the expansion plus post_ms"
  responding: "a cell responds when, in every seed and r/v, the peak exceeds the baseline by at least sim.Params.w_syn (one synapse's jump at rest)"
  fit: "per cell, y = collision time - peak time per seed and r/v; the median over seeds per r/v; ordinary least squares y = alpha * rv - delta over the four r/v"

data_rule:
  flies: control
  min_flies: 8
  min_flies_why: "eight of the ten control flies with both trials readable; with fewer the bootstrap interval rests on too few animals"
  trace: "the one 2-D array of shape (80000, 4) in each file, columns in columns_rv_ms order; any other content refuses"
  trial_mean: "per fly and r/v, the mean of its two trials"
  baseline_s: 1.0
  baseline_source: "Jang et al. 2023: baseline the mean of the 1 s before stimulus onset"
  filter: "Savitzky-Golay, polynomial order 4, frame the expansion's duration / 10 in samples rounded up to odd (Jang et al. 2023: 'frame size is 1/10th the length of the stimulus')"
  peak: "the first maximum of the filtered, baseline-subtracted trace in the window from onset to the end of the expansion plus post_ms"
  fit: "per fly, ordinary least squares y = alpha * rv - delta over the four r/v"
  bootstrap: 10000
  bootstrap_seed: 34
  interval: "the 2.5 and 97.5 percentiles of the median alpha (and delta) over flies resampled with replacement"
  mutants: "not used"

no_go:
  min_responding_share: 0.5
  rule: "computed on the model only, before any data file is opened: if fewer than half of the 15 cells respond, the run stops and is recorded as uninformative"
  why: "a peak time is defined only where the giant fiber moves; a slope from a few responding cells says little about the circuit"

score:
  statistic: "alpha per responding cell against the data's interval of the median alpha"
  verdict:
    pass: "every responding cell's alpha lies inside the interval"
    partial: "some responding cells' alpha lie inside it"
    fail: "none does"
    uninformative: "the no-go, or fewer than min_flies readable control flies"
  reported: "delta per cell and from the data (secondary, decides nothing), the implied threshold angle 2 * atan(1 / alpha), and per cell whether the median peak times increase with r/v"

limits:
  - "Engineered transducers: LC4 and LPLC2 rates follow angular velocity and size linearly with scanned gains; no measured LC4 or LPLC2 rate exists."
  - "Both sides of LC4 and LPLC2 are driven and both giant fibers averaged: the recorded side and the disc's azimuth are not stated."
  - "The disc sizes of the 2025 recordings are inferred from the protocol they cite (Jang et al. 2023)."
  - "The control flies are genotype controls of DIP-epsilon experiments; their sex is not stated in the paper."
  - "A spiking LIF giant fiber is compared with a graded recording: where the model fires, its peak is its first threshold crossing."
  - "The scored quantity is a slope across four r/v per fly; one control file had been opened before the lock (seen_before_lock)."

defaults_changed: false
