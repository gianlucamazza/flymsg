stimulus:
  rv_ms: [10.0, 20.0, 40.0, 80.0]
  start_deg: 10.0
  end_deg: 63.0
  size: "full angular size theta: tan(theta / 2) = (r/v) / t_to_collision (flymsg.eye.looming_radius_deg gives theta / 2); the disc expands from start_deg to end_deg and then holds; the virtual collision lies (r/v) / tan(end_deg / 2) after the end of the expansion"
  source: "Jang et al. 2023 (10 to 63 degrees, then held for 1 s; r/v 10, 20, 40, 80 ms), the protocol Dombrovski et al. 2025 cite for these recordings; inferred for them"

drive:
  lc4_type: LC4
  lc4_neurons: 126
  lplc2_type: LPLC2
  lplc2_neurons: 185
  sides: both
  sides_why: "the recorded side and the disc's azimuth in the 2025 runs are not stated"
  lc4_rate: "g4 * dtheta/dt, dtheta/dt in rad/s"
  lplc2_rate: "g2 * theta, theta in rad"
  forms_why: "Ache et al. 2019 (abstract): the giant fiber follows 'a linear function of angular velocity (provided by LC4) and a Gaussian function of angular size (provided by LPLC2)'; the Gaussian's parameters were not read from the paper, so size enters linearly; neither is a measured LC4 or LPLC2 spike rate"
  cap_rule: "every rate is capped at 1000 / sim.Params.t_ref Hz, and kicks pass a dead time of one refractory period (song.dead_time), since stimulated neurons are never refractory in the kernel: the delivered rate is at most lambda / (1 + lambda * t_ref)"
  g4_hz_per_rad_s: [0.0, 2.0, 5.0, 10.0]
  g2_hz_per_rad: [0.0, 50.0, 100.0, 200.0]
  grid_why: "engineered envelope: LC4 and LPLC2 spike rates to looming are not measured (docs/leads.md, G3). At r/v 10 ms dtheta/dt reaches about 55 rad/s at 63 degrees, so g4 spans no input to the cap; theta reaches 1.1 rad, so g2 spans no input to about 220 Hz. The cell with both gains 0 has no input and is left out: 15 cells."
  kicks: "per neuron and neural step, Poisson counts at the rate of that step, then the dead time; one kick is about 48 mV. LPLC2's drive steps from 0 to g2 * 0.17 rad at onset, as the disc appears at 10 degrees"

model:
  pre_ms: 200.0
  post_ms: 150.0
  post_why: "the window ends 150 ms after the expansion stops (Dombrovski et al. 2025 score 150 ms after onset in their Fig. 1); a later peak is no longer driven by expansion"
  seed0: 340
  seeds: 5
  readout: "the membrane potential of DNp01(GF)_R and DNp01(GF)_L at every neural step (CpuRuntime.read), a sample standing at the end of its step, filtered as the data (data_rule.filter, the same frame in ms, since the distortion it gives an asymmetric peak grows with r/v and would otherwise bias alpha; the run lasts one frame past the window so the filter's edge stays outside it); per giant fiber the baseline is the mean over pre_ms and the peak time the first sample in the window (after onset to the end of the expansion plus post_ms) at reach of its window maximum above baseline; the run's peak time is the mean of the two"
  reach: 0.95
  reach_why: "a noisy plateau makes the time of the maximum itself arbitrary; the first time at 95% of it is defined the same way in model and data"
  near_end_ms: 20.0
  near_end_why: "a peak within 20 ms after the expansion stops follows the stimulus; the share of such peaks is reported per cell and per fly"
  responding: "a cell responds when, in every seed and r/v, both giant fibers rise by at least sim.Params.w_syn (one synapse's jump at rest): a bar for a defined peak, not for strength"
  graded: "a cell stays graded when neither giant fiber fires in the window in any seed and r/v; the recordings are subthreshold, so only responding and graded cells are scored, and the others are reported"
  fit: "per cell, y = collision time - peak time per seed and r/v; the median over seeds per r/v; ordinary least squares y = alpha * rv - delta over the four r/v"
  timing: "a kick at a step reaches the potential at the next; with the sample at the end of its step this is a constant 0.1 to 0.2 ms, which enters delta only"

data_rule:
  flies: control
  files: "every locked control file must exist (checked before the model runs, without opening them), match its md5 and hold one trace array; otherwise the run refuses, so all ten flies enter the interval"
  trace: "the one array of shape (80000, 4) in each file, columns in columns_rv_ms order; arrays of other shapes are ignored, and none or several of this shape refuse"
  trial_mean: "per fly and r/v, the mean of its two trials"
  baseline_s: 1.0
  baseline_source: "Jang et al. 2023: baseline the mean of the 1 s before stimulus onset"
  filter: "Savitzky-Golay, polynomial order 4, frame the expansion's duration / 10 in samples rounded up to odd (Jang et al. 2023: 'frame size is 1/10th the length of the stimulus')"
  peak: "the first time the filtered trace reaches reach of its maximum above baseline in the window after onset to the end of the expansion plus post_ms (model.reach); a peak on the window's last sample is counted and reported"
  fit: "per fly, ordinary least squares y = alpha * rv - delta over the four r/v"
  bootstrap: 10000
  bootstrap_seed: 34
  interval: "the 2.5 and 97.5 percentiles of the median alpha (and delta) over flies resampled with replacement"
  mutants: "not used"

no_go:
  min_scored_cells: 4
  rule: "computed on the model only, before any data file is opened (only their presence is checked before the model runs): if fewer than 4 of the 15 cells respond and stay graded, the run stops and is recorded as uninformative"
  why: "a quarter of the grid, as song's min_scored; a slope from fewer graded cells says little about the circuit"

score:
  statistic: "alpha per scored (responding and graded) cell against the data's interval of the median alpha"
  stimulus_locked: "a trace that only follows the stimulus gives a slope whatever the circuit: the locked readout (filter, reach, window, fit) applied to theta and dtheta/dt, raw and through tau_syn, tau_m and both (sim.Params), at the model's and the data's dt, gives a band (about 1.73 to 2.01), and a peak at onset gives 1 / tan(start_deg / 2) (about 11.43); if the flies' interval overlaps the band or holds the onset slope, the timing cannot separate the circuit from the stimulus. Each scored cell's distance from the band is reported: only that part of its slope is the circuit's"
  verdict:
    pass: "every scored cell's alpha lies inside the interval"
    partial: "some scored cells' alpha lie inside it"
    fail: "none does"
    uninformative: "the no-go, no scored cell, or an interval that overlaps the stimulus-locked band or holds the onset slope"
  reported: "delta per cell and from the data (secondary, decides nothing), the implied threshold angle 2 * atan(1 / alpha), per cell whether the median peak times increase with r/v, the share of peaks near the end of the expansion, edge peaks, and the cells that respond but fire"

limits:
  - "Engineered transducers: LC4 and LPLC2 rates follow angular velocity and size linearly with scanned gains; no measured LC4 or LPLC2 rate exists."
  - "Both sides of LC4 and LPLC2 are driven and both giant fibers averaged: the recorded side and the disc's azimuth are not stated."
  - "The disc sizes of the 2025 recordings are inferred from the protocol they cite (Jang et al. 2023)."
  - "The control flies are genotype controls of DIP-epsilon experiments; their sex is not stated in the paper."
  - "Only cells where the LIF giant fibers stay subthreshold are scored, since the recordings are graded; cells where they fire are reported, not scored."
  - "Graded cells are the weak-gain ones, whose peaks come latest and closest to a stimulus follower; the stimulus-locked band is the guard, and the distance from it is reported."
  - "The scored quantity is a slope across four r/v per fly; one control file and the xlsx had been opened, and the Fig. 1 file's structure seen, before the lock (seen_before_lock)."

defaults_changed: false
