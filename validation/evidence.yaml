    organism:
      species: "Drosophila melanogaster"
      sex: male
      stage: adult
    cell:
      type: "every MaleCNS neuron"
      maps_to: "rows of data/neurons.parquet by bodyId"
      mapping_uncertainty: "none: same dataset"
    transfer_limits: "a connection's region stands for both partners' neurites there"
    transformation:
      code: "flymsg.song.region_counts"
      inputs_sha256: "43748c76db13e339e9eeb6f4d56e98aab704a4f7fa8bf3cb916b323000070d04"
    used_by: [validation/song.yaml]

  - id: yamakoshi_jo_ab_ratio
    quantity: "ratio of JO-A to JO-B peak calcium responses to a 35 ms IPI pulse song and to a 100 Hz tone"
    value: "computed from the deposited traces by flymsg.song.yamakoshi_ratios at run time and written to the run's report"
    unit: dimensionless
    status: measured
    method: "GCaMP6f in F-Gal4, iav-Gal4 (pan-JO) control flies, two ROIs on the JO-A and JO-B axon bundles in the AMMC; 10 fps, 2 s sounds from 2 s, four trials; the authors' pipeline (dF/F on frames 1-19, linear bleaching fit on frames 1-19 and 61-100, trial mean, three-frame average), peak over the stimulus; median over 11 flies of the per-fly ratio, computed at run time"
    uncertainty: "fly-to-fly spread of the ratio; reported by the run"
    source:
      citation: "Yamakoshi et al. 2025, iScience (PMC12358670); data Mendeley 10.17632/29hpr3nrrv"
      doi: "10.1016/j.isci.2025.113232"
      license: "CC BY 4.0"
      locator: "Figure 3 data, control flies"
    organism:
      species: "Drosophila melanogaster"
      sex: female
      stage: "adult, virgin, 5-7 days"
    cell:
      type: "JO-A and JO-B axon bundles"
      maps_to: "MaleCNS JO-A and JO-B (types starting JO-A, JO-B)"
      mapping_uncertainty: "subgroups separated by ROI position, not by drivers"
    transfer_limits: "female, 167 Hz pulse carrier, 100 Hz tone for a 150 Hz sine, songs and tone at different amplitudes (only the A/B ratio within a stimulus is used), calcium peaks as a proxy for rates"
    transformation:
      code: "flymsg.song.yamakoshi_ratios"
      inputs_sha256: "aafe9a31c3744a46cf8c0aba29818aaa65c2a16105c9f02cf3e173af9c1a5dbe"
    used_by: [validation/song.yaml]

  - id: dombrovski_gf_looming
    quantity: "giant fiber (DNp01) membrane potential in whole-cell current clamp during looming discs at four r/v, two trials per fly"
    value: "the deposited files: per fly and trial one 4 s trace per r/v (10, 20, 40, 80 ms) at 20 kHz, stimulus at 2 s; 10 control flies (DIP-epsilon null controls 18-22, RNAi controls 06-10) and 12 mutant flies"
    unit: "mV"
    status: measured
    method: "in vivo whole-cell current clamp of the giant fiber in tethered flies, as in Jang et al. 2023 (Methods: 'as previously described'); trial means per animal; Extended Data Fig. 8"
    uncertainty: "per fly, two trials; between flies, the spread of 5 + 5 control animals"
    source:
      citation: "Dombrovski, Zang, Frighetto et al. 2025, Nature 644:453; data: Zenodo record 14983850"
      doi: "10.1038/s41586-025-09037-4"
      license: "CC BY 4.0 (data and article)"
      locator: "Methods, electrophysiology; Extended Data Fig. 8; Data availability (Zenodo 10.5281/zenodo.14983850)"
    organism:
      species: "Drosophila melanogaster"
      sex: unknown
      stage: adult
    cell:
      type: "giant fiber (DNp01)"
      maps_to: "MaleCNS DNp01(GF)_R and DNp01(GF)_L"
      mapping_uncertainty: "the recorded side is not stated; the controls are genotype controls of DIP-epsilon experiments, not wild type"
    transfer_limits: "timing only is used: the peak time relative to the virtual collision per r/v; amplitudes are not compared with the LIF's millivolts"
    transformation:
      code: "flymsg.gf_looming.data_fits"
      inputs_sha256: "none yet: the files are downloaded after the lock; their md5 sums from the Zenodo record are in validation/gf_looming.yaml"
    used_by: [validation/gf_looming.yaml]

  - id: jang_looming_protocol
    quantity: "looming protocol of the giant-fiber recordings: disc start and end size, r/v, hold, display"
    value:
      start_deg: 10.0
      end_deg: 63.0
      hold_s: 1.0
      rv_ms: [10.0, 20.0, 40.0, 80.0]
      display_hz: 240.0
    unit: "deg (full angular size), s, ms, Hz"
    status: inferred
    method: "stated by Jang et al. 2023 for their recordings ('starting at 10 deg and expanding to 63 deg in angular size and held for 1 s', r/v = 10, 20, 40, 80 ms, black disc on white, 240 Hz); Dombrovski et al. 2025 record 'as previously described' citing it and do not restate the sizes, so their use for the 2025 traces is inferred; before the lock an agent noted that one deposited control trace's peak timing is consistent with it (validation/gf_looming.yaml, seen_before_lock)"
    uncertainty: "the 2025 disc sizes and positions are not stated; the deposited traces carry no stimulus channel"
    source:
      citation: "Jang, Goodman, Ausborn & von Reyn 2023, J Exp Biol 226:jeb244790 (PMC10263144)"
      doi: "10.1242/jeb.244790"
      license: unknown
      locator: "Materials and methods, visual stimulation and electrophysiology"
    organism:
      species: "Drosophila melanogaster"
      sex: female
      stage: "adult, 2-5 days"
    cell:
      type: "giant fiber (DNp01)"
      maps_to: "the stimulus geometry of validation/gf_looming.yaml"
      mapping_uncertainty: "inferred protocol for the 2025 recordings"
    transfer_limits: "only the geometry (10 to 63 degrees, r/v) enters the model; display, luminance and azimuth do not"
    transformation:
      code: "flymsg.gf_looming.expansion"
      inputs_sha256: "none: transcribed from the published methods (doi and locator); no file archived"
    used_by: [validation/gf_looming.yaml]

  - id: apl_claw_odor_contrast
    quantity: "direction of the OCT/MCH contrast at Kenyon cell claws with APL output intact and blocked, against PN boutons"
    value:
      on_oct_vs_mch_p: 0.949
      off_oct_vs_mch_p: 0.0003
      claws_on_vs_off_delta_p: 0.0011
      boutons_vs_claws_on_delta_p: 0.0024
      boutons_vs_claws_off_delta_p: 0.9698
      boutons_vs_claws_default_delta_p: 0.0271
      n_flies: 10
    unit: "p values (two-way ANOVA with Tukey; Brown-Forsythe and Welch ANOVA), flies"
    status: measured
    method: "two-photon imaging of MB247-homer::GCaMP3 at calyx microglomeruli (claws) in APLi > TNT, tubP-GAL80ts flies (24-48 h at 31 C; APL OFF) and in calyces without TNT expression (APL ON); NP225 > Syp-GCaMP3 at PN boutons; 4-methylcyclohexanol and 3-octanol 1:100, 5 s"
    uncertainty: "only directions and p values are used; amplitudes are in the deposited spreadsheets, not transcribed"
    source:
      citation: "Prisco, Deimel, Yeliseyeva, Fiala, Tavosanis 2021, eLife 10:e74172 (PMC8741211)"
      doi: "10.7554/eLife.74172"
      license: "CC BY 4.0 (article); data Dryad doi:10.5061/dryad.bk3j9kdd1, CC0"
      locator: "Results (APL silencing), Figure 4B and 4D, Figure 4-figure supplement 1"
    organism:
      species: "Drosophila melanogaster"
      sex: "mixed (males and females)"
      stage: "adult, 1-7 days"
    cell:
      type: "Kenyon cell claws (microglomeruli), PN boutons (NP225), APL"
      maps_to: "^KC, ALPN and APL in MaleCNS v1.0"
      mapping_uncertainty: "claws are KC dendritic compartments, the model's KCs are points; NP225 is a subset of uniglomerular PNs"
    transfer_limits: "relational only: each readout's own odor contrast, never amplitudes across readouts"
    transformation:
      code: "flymsg.apl_claws decides on the directions"
      inputs_sha256: "none: transcribed from the published text (doi and locator); no file archived"
    used_by: [validation/apl_claws.yaml]
