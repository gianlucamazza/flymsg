# Sensitivity grid. Version 1, fixed 2026-10-12 before any grid run.
# Changing a locked field requires incrementing `version` and updating
# `content_sha256` and flymsg.sensitivity.VERSION_HASHES.
# `flymsg sensitivity` prints this file; `--run` executes it.
version: 1
content_sha256: 59806931f038d4565eeaee40cb15f5671db1bb3931ddf319f0c0b0b61eb55fef

issue: 28
claim:
  kind: robustness_report
  scored: false
  reason: "A grid around the defaults describes where the responses hold and where they fail. It does not select a parameter, does not change sim.Params defaults, and does not replace criterion v4, N1, the held-out manifest or any frozen score."

grid:
  w_syn_factors: [0.8, 0.9, 1.0, 1.1, 1.2]
  th_jump: [0.0, 2.0]
  seed0: 0
  seeds: 5
  rate_hz: 100.0
  stim_ms: 300.0
  duration_ms: 600.0

cases:
  positive: [looming escape, giant fiber output, P1 courtship drive, pIP10 song pathway, sugar feeding]
  negative: [bitter feeding]

metrics:
  target_rate: "rate of the best neuron of each target type during the stimulus, Hz, per seed"
  latency: "first spike of that neuron, ms, per seed; empty if it does not fire"
  recruited: "neurons other than the stimulus that fire during the stimulus, per seed"
  persistent: "neurons that fire from 400 to 600 ms, per seed"

report:
  every_cell: true
  seed_spread: "at each cell, the range over seeds; this is seed variability, not parameter sensitivity"
  parameter_spread: "for each case and metric, the range of the seed medians over the cells"
  holds: "a target holds at a cell when its best neuron fires at least 3 spikes during the stimulus in at least 2/3 of the seeds (the v4 floor)"
  holds_min_spikes: 3
  holds_seed_share_num: 2
  holds_seed_share_den: 3
  not_in_scope:
    - numerical_implementation
    - biological_uncertainty

limits:
  - "Two parameters only; the grid does not span gap junctions, cell-type parameters or plasticity, which have no value in this LIF."
  - "Every cell is reported, so a region that holds is read against the cells around it; nothing is chosen from the grid."
  - "Many cells and metrics are compared at once; no cell is tested for significance, so no p-value is attached."
