# APL and the odor contrast at Kenyon cell claws (issue 85). Version 1, fixed 2026-10-15 before
# any run. Changing a locked field requires incrementing `version` and updating `content_sha256`
# and flymsg.apl_claws.VERSION_HASHES. `flymsg apl-claws` prints this file; `--run` executes it.
version: 1
content_sha256: 4478289480e026c72cca984a892b8874c3016412a668889c75ba3f2ef9b0ec45
yaml_subset: 2
evidence: [apl_claw_odor_contrast]

issue: 85
claim:
  kind: relational
  scored: true
  what: "Whether the model's APL equalises the two odors at the Kenyon cells' input as Prisco et al. 2021 measured: with APL output intact the OCT/MCH contrast at KC claws is smaller than at PN boutons, and with APL output blocked it rises to the PN boutons' contrast. Directions only; no amplitude is compared."
  source: "Prisco, Deimel, Yeliseyeva, Fiala, Tavosanis 2021, eLife 10:e74172, doi:10.7554/eLife.74172 (CC BY 4.0), Figure 4B and Figure 4-figure supplement 1, read in full text (PMC8741211)"

seen_before_lock: "The KC sparseness locks v1-v8 on 3-octanol and 4-methylcyclohexanol (results/kc-sparseness; KC spike counts and responders per arm, never KC membrane potential); version 1 removed APL -> KC (arm C) and KCs went dense. No run of this protocol, no APL-output-removed arm and no KC depolarization readout has been made. The Dryad deposit (doi:10.5061/dryad.bk3j9kdd1, CC0) was listed (file names, sizes, sha-256) and not downloaded; it does not enter the verdict."

data_measured:
  apl_on: "APL ON calyces (TNT not expressed): average peak among responding microglomeruli, OCT vs MCH not different (n = 10, p = 0.949, two-way ANOVA with Tukey); responding microglomeruli p = 0.995"
  apl_off: "APL OFF calyces (APLi > TNT, tubP-GAL80ts, 24-48 h at 31 C): OCT stronger than MCH (n = 10, p = 0.0003); responding microglomeruli slightly more (p = 0.047)"
  contrast: "inter-odour delta (Figure 4-figure supplement 1, n = 10): KC claws APL ON vs APL OFF p = 0.0011; PN boutons vs KC claws APL ON p = 0.0024; PN boutons vs KC claws APL OFF p = 0.9698; PN boutons vs KC claws in the default genotype p = 0.0271 (Brown-Forsythe and Welch ANOVA with multiple comparisons)"
  odors: "4-methylcyclohexanol and 3-octanol, 1:100 in mineral oil, 5 s"
  sex: "mixed populations of males and females"

protocol:
  odor_source: door
  odors: [3-octanol, 4-methylcyclohexanol]
  odor_rule: "Prisco et al.'s two odors, as in the KC sparseness locks (DoOR consensus, ropensci/DoOR.data at db323a4)"
  rate_at_response_1_hz: 100.0
  rate_from: "the stimulus rate of every flymsg protocol; DoOR responses are normalised, so the rate of a response of 1 is a named compensation"
  odor_ms: 1000.0
  duration_ms: 1000.0
  seeds: [420, 421, 422, 423, 424]
  seeds_why: "five seeds disjoint from every other lock (KC sparseness used 50-97)"
  kc: "^KC"
  apl: APL
  apl_n: 2
  pn_class: ALPN

arms:
  on: "the default model"
  off: "every synapse from the two APL neurons removed (TNT blocks APL release onto all its targets, KCs and PN boutons alike)"

readout:
  claw: "per seed and odor, the mean over every KC of its membrane potential above v_rest averaged over the odor window: the model has no claw compartment, so the KC's point potential stands for its claw response"
  bouton: "per seed and odor, the spikes of every ALPN during the odor window: NP225 PNs are a subset of uniglomerular ALPNs, and a bouton's synaptic calcium follows the PN's spikes"
  contrast: "c = (x_OCT - x_MCH) / (x_OCT + x_MCH) per seed, for claws in each arm (c_on, c_off) and for boutons in arm on (c_pn); unitless, so mV and spike counts compare only through their own odor contrast"
  summary: "the median over the five seeds of each contrast; the share of seeds in which each relation holds is reported"

no_go:
  rule: "computed before the verdict: if the seed median of the model's PN contrast c_pn is not positive (OCT does not drive the ALPNs more than MCH), or the claw depolarization is not positive (zero, or KCs held below rest) for either odor in either arm in any seed, or any seed's contrast is undefined (both odors zero), the premise of the measurement is absent and the run is recorded as uninformative"
  why: "the measured effect is APL hiding an input contrast that PN boutons carry; without that contrast in the model's PNs there is nothing for APL to hide"

score:
  relations:
    raises: "c_off > c_on (blocking APL raises the claw contrast; Figure 4B, p = 0.0003 OFF vs 0.949 ON; supplement p = 0.0011)"
    restores: "|c_off - c_pn| < |c_on - c_pn| (without APL the claw contrast is nearer the boutons' than with it; supplement p = 0.9698 OFF vs 0.0024 ON)"
  verdict:
    pass: "both relations hold on the seed medians"
    partial: "raises holds and restores does not"
    fail: "raises does not hold"
    uninformative: "the no-go"
  reported: "c_on, c_off and c_pn per seed and their medians; the claw depolarization per odor and arm; the fraction of KCs that spike per odor and arm; c_on's sign (the data show no ON difference, so a negative c_on is reported, not scored)"

limits:
  - "Point neurons: the KC's somatic potential stands for a claw's postsynaptic calcium; APL's local inhibition at the claws (Amin et al. 2020) is not compartmentalised."
  - "Units differ between readouts, so only each readout's own odor contrast enters the relations; GCaMP's nonlinearity is not modelled."
  - "Prisco et al. average the peak over responding microglomeruli and compare a raw inter-odour delta; the model averages the window potential over every KC and compares a normalised contrast, so silent KCs dilute both odors alike."
  - "The KC potential is clipped by threshold and reset: a dense population compresses the claw contrast (towards a false fail) and a population held near rest makes it rest on small numbers; the KC spiking fractions are reported beside the verdict to read either case."
  - "Odor drive is DoOR consensus responses at 100 Hz per unit response, not Prisco et al.'s 1:100 dilutions; 1 s of odor, not 5 s."
  - "The measured flies are mixed sex; the model is male."
  - "ALPN stands for NP225 boutons; NP225 labels a subset of uniglomerular PNs."
  - "TNT blocks APL output for 24-48 h and may change more than release; the model removes the synapses only."
  - "The data's statistics are across flies (n = 10); the model's across seeds of one connectome."

defaults_changed: false
