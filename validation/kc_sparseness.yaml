# Kenyon cell sparseness diagnostic (issues 95, 85). Version 8, fixed 2026-10-14 after the
# version 7 result. Version 1 is the file at b096b4a, version 2 at 374309e, version 3 at
# c1cf896, version 4 at b1116af, version 5 at 00aff9c, version 6 at dbbfcf2, version 7 at
# 45c0641. A diagnosis, not a fix: the default
# model is not changed by the result. Changing a locked field requires incrementing `version`
# and updating `content_sha256` and flymsg.kc_sparseness.VERSION_HASHES. `flymsg
# kc-sparseness` prints this file.
version: 8
content_sha256: 5f1a9e0d643da086353b6d987fa6b1220503a2b7b6cebafa325145f47aa12cbc
yaml_subset: 2
evidence: [eln_pn_coupling, eln_spike_amplitude, sister_pn_coupling, kc_odor_sparseness]

issue: 95
supersedes:
  version: 7
  verdict: "within: the eight coupled arms and the uncoupled E and F of lLN2T+lLN1_bc except E/lLN2T+lLN1_bc+spike0ms; none of lLN2T"
  reason: "Version 7 ran with the boundary reset (flymsg.gap/boundary-reset-v1), qualified against the continuous clamp on 50 ms of one odor and seed only, because the dense per-mask exponential of the continuous clamp made the coupled arms take days (#155). The truncated Taylor action (flymsg.gap/continuous-clamp-taylor-v1, ADR accepted 2026-10-14) integrates the same continuous clamp to rounding at about the boundary reset's cost. Version 8 is version 7 under the continuous clamp, with fresh seeds, so that the result does not rest on the 50 ms qualification."
question: "With only the local neurons Eckstein et al. 2024 liken to the cholinergic eLNs (lLN2T_a/b/c; with lLN1_bc as a variant) treated as electrical partners of PNs, at the measured asymmetric coupling with sister PNs coupled as measured and eLN spikes crossing as 40 mV spikelets of 0.5-2 ms, and every other cholinergic local neuron kept chemical, do Hige et al. 2015's two odors recruit a sparse, distinct set of Kenyon cells?"

seen_before_lock: "Versions 1-5 (results/kc-sparseness/v1-v5; seeds 60-62, 70-72, 80-82, 83-85, 86-88), the KC -> MBON11 run (seeds 50-52), and version 6, interrupted: its five uncoupled arms (A, E and F per eLN set, seeds 89-91) were computed and saved in the run's step store, and none of their values was read before this lock. Engineering measurements on the lLN2T coupling, seed 0, which no lock uses: component sizes, the cost of the continuous clamp over 10 ms, and the boundary_qualification runs. Version 7 (results/kc-sparseness/v7.executions/f8549bf.../output, seeds 92-94): its verdict, per-arm fractions and overlaps were read before this lock. Engineering runs of the Taylor action against the dense maps (docs/evidence/gap-taylor-qualification-2026-10-14.json, seed 0). Version 8 changes only the integrator, the seeds and these notes; every arm, bound and decision rule is version 7's."

sources:
  sparseness: "Turner, Bazhenov & Laurent 2008, J Neurophysiol 99:734, doi:10.1152/jn.01283.2007, Fig 2A: an odor evokes spikes in 6 +/- 5% of KCs (n = 71)"
  sparseness_imaging: "Honegger, Campbell & Turner 2011, J Neurosci 31:11772, doi:10.1523/JNEUROSCI.1099-11.2011, Fig 5A: about 5% of KCs per odor (933 KCs, 8 flies); single flies up to 17%"
  overlap: "Campbell et al. 2013, J Neurosci 33:10568, doi:10.1523/JNEUROSCI.0682-12.2013, Fig 4B-C: 64.6% of responders shared between similar odors, 21.8% between dissimilar ones"
  kc_kc: "Manoim et al. 2022, Curr Biol, doi:10.1016/j.cub.2022.09.007: axo-axonic KC -> KC connections act through the metabotropic mAChR-B and suppress odor responses of neighbouring KCs"
  eln_pn: "Yaksi & Wilson 2010, Neuron 67:1034, doi:10.1016/j.neuron.2010.08.041, Fig 4 and 7: excitatory local neuron -> PN coupling is electrical (abolished in shakB2, insensitive to Cd2+ and mecamylamine), and shakB2 abolishes odor-evoked lateral excitation of PNs"
  eln_pn_caveat: "Huang et al. 2010, Neuron 67:1021, doi:10.1016/j.neuron.2010.08.025, report a cholinergic chemical component as well; the transmitter of lateral-lineage LNs in MaleCNS is a prediction"
  lateral_input: "Olsen, Bhandawat & Wilson 2007, Neuron 54:89, doi:10.1016/j.neuron.2007.03.010, Fig 5-6: with one ORN type active, PNs of other glomeruli depolarize by 1.7-11.8 mV and spike only a few times"
  odors: "Münch & Galizia 2016, Sci Rep 6:21841, doi:10.1038/srep21841 (DoOR consensus responses, ropensci/DoOR.data at db323a4)"
  overlap_oct_mch: "Hige et al. 2015, Neuron 88:985, doi:10.1016/j.neuron.2015.11.003: 33% of MCH-responding and 30% of OCT-responding KCs respond to both"
  apl: "Lin et al. 2014, Nat Neurosci 17:559, doi:10.1038/nn.3660: blocking APL output makes KC responses denser and more correlated across odors"
  model_rule: "flymsg gives metabotropic transmitters no fast effect (sign 0, docs/model.md)"
  eln_pn_coupling: "Yaksi & Wilson 2010, Neuron 67:1034, doi:10.1016/j.neuron.2010.08.041, Fig 4C and 4F, control pairs of the shakB2 comparison (n = 37 eLN -> PN): coupling coefficient eLN -> PN 0.0021 for hyperpolarizing steps (0.0083 for depolarizing), PN -> eLN 0.0039 (hyperpolarizing); hyperpolarizing steps pass the electrical component only; values measured from the bar heights"
  eln_spikes: "Yaksi & Wilson 2010 (text, Fig 2D): eLNs fire full-sized spikes of about 40 mV, besides attenuated ~10 mV events"
  sister_pn_coupling: "Kazama & Wilson 2009, Nat Neurosci 12:1136, doi:10.1038/nn.2376, Fig 7d: coupling coefficient 0.013 between ipsilateral homotypic (DM6) PNs for hyperpolarizing steps, which reveal the electrical component only (0.011 in Cd2+); value read from the bar height"
  eln_pn_identity: "the krasavietz eLNs of Yaksi & Wilson 2010 and Huang et al. 2010 have no genetically confirmed EM type (audit 2026-10-13); the coefficients are given in Fig 4C/4F, not in the text"
  eln_types: "Eckstein et al. 2024, Cell 187:2574, doi:10.1016/j.cell.2024.03.016 (CC BY 4.0), STAR Methods on antennal lobe local neurons: 'among them are ~13 lLN2T_abc neurons that have a cell body placement and general morphology most similar to reported cholinergic local neurons' (refs Shang et al. 2007, Yaksi & Wilson 2010); Figure S5F legend: these neurons 'are the most similar to described Krasavietz positive cholinergic local neurons'. Soma position and morphology only, no staining. lLN1_bc: 'Positioned closely among them are other local lLN1_bc neurons', some of which the authors suspect are cholinergic; not named a krasavietz match. MaleCNS v1.0 types all four as class ALLN, acetylcholine"

protocol:
  odor_source: door
  odors: [3-octanol, 4-methylcyclohexanol]
  odor_rule: "the two odors of Hige et al. 2015 (OCT, MCH)"
  rate_at_response_1_hz: 100.0
  rate_from: "the stimulus rate of every flymsg protocol; DoOR responses are normalised, so the rate of a response of 1 is a named compensation"
  unmeasured: "ORN types without a DoOR response for the odorant get no input"
  odor_ms: 1000.0
  duration_ms: 1000.0
  seeds: [95, 96, 97]
  kc: "^KC"
  apl: APL
  apl_n: 2
  ln_class: ALLN
  pn_class: ALPN
  ln_transmitter: acetylcholine
  eln_sets:
    lLN2T:
      types: [lLN2T_a, lLN2T_b, lLN2T_c]
      n: 13
    lLN2T+lLN1_bc:
      types: [lLN2T_a, lLN2T_b, lLN2T_c, lLN1_bc]
      n: 43
  eln_rule: "arms E and F and every coupled arm run once per eLN set, named <arm>/<set>; only that set's chemical synapses onto ALPNs are removed and coupled, and the other cholinergic ALLNs stay chemical"
  responder: "a Kenyon cell that spikes during the odor in at least 2 of the 3 seeds"
  responder_note: "the model has no spontaneous KC activity, so the measured criteria (a rise above baseline SD) reduce to any spike; reliability across seeds stands in for repeated presentations"

arms:
  A: "the default model"
  E: "chemical synapses from the eLN set onto projection neurons (class ALPN) removed: in the fly that coupling is electrical"
  F: "E, and KC -> KC synapses without fast effect, as the model treats metabotropic transmission"

coupling:
  bases: [E, F]
  pairs: "each neuron of the eLN set and ALPN joined by chemical synapses (either direction): one electrical synapse per pair, as Yaksi & Wilson measured per recorded pair"
  eln_to_pn_cc: 0.0021
  pn_to_eln_cc: 0.0039
  sister_cc: 0.013
  rule: "each side couples at c / (1 - c) of the coefficient measured towards it; sister PNs (same type, same side) symmetric"
  eln_spike_mv: 40.0
  spike_ms: [0.0, 0.5, 1.0, 2.0]
  spike_rule: "an eLN spike adds 40 mV to the potential its partners see for spike_ms (0: spikes do not cross); PN spikes do not cross"
  spike_ms_from: "unmeasured: from no spikelet to a 2 ms one around the ~1 ms width of an insect spike; scanned, not chosen"
  arm_names: "<base>/<set>+spike<ms>ms, e.g. E/lLN2T+spike1ms; 16 coupled arms"

electrical_semantics: flymsg.gap/continuous-clamp-taylor-v1
taylor_qualification: "scripts/qualify_taylor.py, docs/evidence/gap-taylor-qualification-2026-10-14.json: arm E of each eLN set, 3-octanol, 50 ms, seed 0, spikelets 0 and 1 ms; the Taylor action (7 terms) and the dense per-mask maps give the same spike count for every neuron and the same first-spike times (5,255-9,798 spikes), in 3.6-4.9 s against 1,412-1,655 s; one 1000 ms odor took 14.7 s."

compensations:
  - "Chemical contacts stand in for the unseen electrical ones: EM does not show gap junctions. The eLN sets are a morphological match (Eckstein et al. 2024), not a genetic one; lLN1_bc only neighbours the match."
  - "Coupling coefficients are from paired somatic recordings, which underestimate the coupling at the junction (Yaksi & Wilson 2010), and the two-cell relation c / (1 - c) is applied to cells that couple to many partners."
  - "Junctions do not rectify; the depolarizing excess the fly shows is carried by the spikelets, whose duration is not measured and is scanned."
  - "The spikelet is a rectangle of the full spike amplitude; PN spikes do not cross (their amplitude at the junction is not measured)."
  - "Discrete events act at step boundaries (0.1 ms), as everywhere in the model."
  - "The continuous clamp is integrated by a Taylor series truncated where its bound falls below the float64 unit roundoff (flymsg.gap/continuous-clamp-taylor-v1); against the dense maps the spikes agree for every neuron in taylor_qualification."

decides:
  sparse_min: 0.01
  sparse_min_from: "Turner et al. 2008: 6% minus one SD (5%)"
  sparse_max: 0.17
  overlap_max: 0.646
  within: "both odors recruit between sparse_min and sparse_max of the Kenyon cells and the shared responders are at most overlap_max of each odor's responders"
  verdict: "the list of arms that are within, or none"

reported:
  overlap_vs_hige:
    decides: false
    what: "the shared share of each odor's responders, next to the 30% (OCT) and 33% (MCH) of Hige et al. 2015"
  pn_spread:
    decides: false
    what: "the share of ALPN neurons that spike during each odor, per arm"
  per_seed:
    decides: false
  per_duration:
    decides: false
    what: "KC and PN fractions of each coupled arm by spikelet duration, to see whether the answer depends on it"
  against_v7:
    decides: false
    what: "each arm's KC fractions and overlap next to version 7's (boundary reset, seeds 92-94)"
  per_set:
    decides: false
    what: "KC and PN fractions of each arm by eLN set (arms.csv); the result note sets them next to v5's whole cholinergic ALLN class (results/kc-sparseness/v5)"

