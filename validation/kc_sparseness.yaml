# Kenyon cell sparseness diagnostic (issues 95, 96). Version 3, fixed 2026-10-13 after the v2
# run and before any v3 run. Version 1 is the file at b096b4a, version 2 at 374309e.
# A diagnosis, not a fix: the default model is not changed by the result. Changing a locked
# field requires incrementing `version` and updating `content_sha256` and
# flymsg.kc_sparseness.VERSION_HASHES. `flymsg kc-sparseness` prints this file.
version: 3
content_sha256: 0a6b0ec6d7b8829cf9aa35de0c945841259a3502ec59e70bd569e1dfd54e0bd2

issue: 95
supersedes:
  version: 2
  verdict: "within: E, F"
  reason: "v2 met its upper bounds only by undershoot: without the chemical cholinergic local neuron -> PN contacts one ORN type drives 0.2% of Kenyon cells, because a single receptor type is not an odor. Version 3 uses the two odors of Hige et al. 2015 as measured receptor vectors (DoOR), adds the lower bound v2 lacked, and keeps the arms."
question: "With the two odors of Hige et al. 2015 as measured receptor vectors, how many Kenyon cells respond and how many are shared, with and without the fast KC -> KC and cholinergic local neuron -> PN synapses?"

seen_before_lock: "Versions 1 and 2 (results/kc-sparseness/v1, v2; seeds 60-62, 70-72) with single ORN types, an exploratory PN count (seed 0), and the KC -> MBON11 run (seeds 50-52). No run has used 3-octanol or 4-methylcyclohexanol before this lock."

sources:
  sparseness: "Turner, Bazhenov & Laurent 2008, J Neurophysiol 99:734, doi:10.1152/jn.01283.2007, Fig 2A: an odor evokes spikes in 6 +/- 5% of KCs (n = 71)"
  sparseness_imaging: "Honegger, Campbell & Turner 2011, J Neurosci 31:11772, doi:10.1523/JNEUROSCI.1099-11.2011, Fig 5A: about 5% of KCs per odor (933 KCs, 8 flies); single flies up to 17%"
  overlap: "Campbell et al. 2013, J Neurosci 33:10568, doi:10.1523/JNEUROSCI.0682-12.2013, Fig 4B-C: 64.6% of responders shared between similar odors, 21.8% between dissimilar ones"
  kc_kc: "Manoim et al. 2022, Curr Biol, doi:10.1016/j.cub.2022.09.007: axo-axonic KC -> KC connections act through the metabotropic mAChR-B and suppress odor responses of neighbouring KCs"
  eln_pn: "Yaksi & Wilson 2010, Neuron 67:1034, doi:10.1016/j.neuron.2010.08.041, Fig 4 and 7: excitatory local neuron -> PN coupling is electrical (abolished in shakB2, insensitive to Cd2+ and mecamylamine), and shakB2 abolishes odor-evoked lateral excitation of PNs"
  eln_pn_caveat: "Huang et al. 2010, Neuron 67:1021, doi:10.1016/j.neuron.2010.08.025, report a cholinergic chemical component as well; the transmitter of lateral-lineage LNs in MaleCNS is a prediction"
  lateral_input: "Olsen, Bhandawat & Wilson 2007, Neuron 54:89, doi:10.1016/j.neuron.2007.03.010, Fig 5-6: with one ORN type active, PNs of other glomeruli depolarize by 1.7-11.8 mV and spike only a few times"
  odors: "Münch & Galizia 2016, Sci Rep 6:21841, doi:10.1038/srep21841 (DoOR consensus responses, ropensci/DoOR.data at db323a4)"
  overlap_oct_mch: "Hige et al. 2015, Neuron 88:985, doi:10.1016/j.neuron.2015.11.003: 33% of MCH-responding and 30% of OCT-responding KCs respond to both"
  apl: "Lin et al. 2014, Nat Neurosci 17:559, doi:10.1038/nn.3660: blocking APL output makes KC responses denser and more correlated across odors"
  model_rule: "flymsg gives metabotropic transmitters no fast effect (sign 0, docs/model.md)"

protocol:
  odor_source: door
  odors: [3-octanol, 4-methylcyclohexanol]
  odor_rule: "the two odors of Hige et al. 2015 (OCT, MCH)"
  rate_at_response_1_hz: 100.0
  rate_from: "the stimulus rate of every flymsg protocol; DoOR responses are normalised, so the rate of a response of 1 is a named compensation"
  unmeasured: "ORN types without a DoOR response for the odorant get no input"
  odor_ms: 1000.0
  duration_ms: 1000.0
  seeds: [80, 81, 82]
  kc: "^KC"
  apl: APL
  apl_n: 2
  ln_class: ALLN
  pn_class: ALPN
  ln_transmitter: acetylcholine
  responder: "a Kenyon cell that spikes during the odor in at least 2 of the 3 seeds"
  responder_note: "the model has no spontaneous KC activity, so the measured criteria (a rise above baseline SD) reduce to any spike; reliability across seeds stands in for repeated presentations"

arms:
  A: "the default model"
  B: "KC -> KC synapses without fast effect, as the model treats metabotropic transmission"
  E: "chemical synapses from cholinergic antennal-lobe local neurons (class ALLN) onto projection neurons (class ALPN) removed: in the fly that coupling is electrical, and the model has no gap junctions"
  F: "B and E together"

decides:
  sparse_min: 0.01
  sparse_min_from: "Turner et al. 2008: 6% minus one SD (5%)"
  sparse_max: 0.17
  overlap_max: 0.646
  within: "both odors recruit between sparse_min and sparse_max of the Kenyon cells and the shared responders are at most overlap_max of each odor's responders"
  verdict: "the list of arms that are within, or none"

reported:
  overlap_vs_hige:
    decides: false
    what: "the shared share of each odor's responders, next to the 30% (OCT) and 33% (MCH) of Hige et al. 2015"
  pn_spread:
    decides: false
    what: "the share of ALPN neurons that spike during each odor, per arm"
  per_seed:
    decides: false

defaults_changed: false
