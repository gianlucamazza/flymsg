# Kenyon cell sparseness diagnostic (issues 95, 85). Version 4, fixed 2026-10-13 after the v3
# run and before any v4 run. Version 1 is the file at b096b4a, version 2 at 374309e, version 3
# at c1cf896. A diagnosis, not a fix: the default model is not changed by the result.
# Changing a locked field requires incrementing `version` and updating `content_sha256` and
# flymsg.kc_sparseness.VERSION_HASHES. `flymsg kc-sparseness` prints this file.
version: 4
content_sha256: 72059246ade98ec69b49ce32bac587e0f6f52d39b2cb747c962fb4177694af67

issue: 95
supersedes:
  version: 3
  verdict: none
  reason: "v3: with Hige et al. 2015's odors the model is dense (default, 36% / 30% of Kenyon cells) or silent (0.2% without the chemical cholinergic local neuron -> PN contacts, arms E and F). In the fly that coupling is electrical (Yaksi & Wilson 2010). Version 4 puts it back as electrical synapses (sim.Gap). No conductance is measured for eLN -> PN (audit 2026-10-13, issue 85), so the coupling is scanned; sister-PN coupling, which is measured, enters at its value."
question: "With the cholinergic local neuron -> PN contacts electrical instead of chemical, scanned in strength, and sister PNs coupled as measured, is there a coupling at which Hige et al. 2015's two odors recruit a sparse, distinct set of Kenyon cells, and what is the least such coupling?"

seen_before_lock: "Versions 1-3 (results/kc-sparseness/v1-v3; seeds 60-62, 70-72, 80-82) and the KC -> MBON11 run (seeds 50-52). No run with electrical synapses has been made before this lock; the coupling grid and the pair rules were written from the v3 result and the pair counts (137 cholinergic ALLN, 686 ALPN, 21,985 LN -> PN contacts; 1,489 same-type PN pairs over all sides), not from any coupled run. An engineering check before the lock: 24,056 eLN-PN and 579 ipsilateral sister pairs on the data, the largest per-step coupling factor 0.29 at coupling 1, and a 100 ms run without input for timing; no neuron was inspected."

sources:
  sparseness: "Turner, Bazhenov & Laurent 2008, J Neurophysiol 99:734, doi:10.1152/jn.01283.2007, Fig 2A: an odor evokes spikes in 6 +/- 5% of KCs (n = 71)"
  sparseness_imaging: "Honegger, Campbell & Turner 2011, J Neurosci 31:11772, doi:10.1523/JNEUROSCI.1099-11.2011, Fig 5A: about 5% of KCs per odor (933 KCs, 8 flies); single flies up to 17%"
  overlap: "Campbell et al. 2013, J Neurosci 33:10568, doi:10.1523/JNEUROSCI.0682-12.2013, Fig 4B-C: 64.6% of responders shared between similar odors, 21.8% between dissimilar ones"
  kc_kc: "Manoim et al. 2022, Curr Biol, doi:10.1016/j.cub.2022.09.007: axo-axonic KC -> KC connections act through the metabotropic mAChR-B and suppress odor responses of neighbouring KCs"
  eln_pn: "Yaksi & Wilson 2010, Neuron 67:1034, doi:10.1016/j.neuron.2010.08.041, Fig 4 and 7: excitatory local neuron -> PN coupling is electrical (abolished in shakB2, insensitive to Cd2+ and mecamylamine), and shakB2 abolishes odor-evoked lateral excitation of PNs"
  eln_pn_caveat: "Huang et al. 2010, Neuron 67:1021, doi:10.1016/j.neuron.2010.08.025, report a cholinergic chemical component as well; the transmitter of lateral-lineage LNs in MaleCNS is a prediction"
  lateral_input: "Olsen, Bhandawat & Wilson 2007, Neuron 54:89, doi:10.1016/j.neuron.2007.03.010, Fig 5-6: with one ORN type active, PNs of other glomeruli depolarize by 1.7-11.8 mV and spike only a few times"
  odors: "Münch & Galizia 2016, Sci Rep 6:21841, doi:10.1038/srep21841 (DoOR consensus responses, ropensci/DoOR.data at db323a4)"
  overlap_oct_mch: "Hige et al. 2015, Neuron 88:985, doi:10.1016/j.neuron.2015.11.003: 33% of MCH-responding and 30% of OCT-responding KCs respond to both"
  apl: "Lin et al. 2014, Nat Neurosci 17:559, doi:10.1038/nn.3660: blocking APL output makes KC responses denser and more correlated across odors"
  model_rule: "flymsg gives metabotropic transmitters no fast effect (sign 0, docs/model.md)"
  sister_pn_coupling: "Kazama & Wilson 2009, Nat Neurosci 12:1136, doi:10.1038/nn.2376, Fig 7d: coupling coefficient 0.013 between ipsilateral homotypic (DM6) PNs for hyperpolarizing steps, which reveal the electrical component only (0.011 in Cd2+); value read from the bar height"
  eln_pn_unmeasured: "Yaksi & Wilson 2010 and Huang et al. 2010 show eLN -> PN electrical coupling (shakB2 abolishes it) without a coupling coefficient or conductance in the text; the krasavietz eLNs have no published MaleCNS type (audit 2026-10-13)"

protocol:
  odor_source: door
  odors: [3-octanol, 4-methylcyclohexanol]
  odor_rule: "the two odors of Hige et al. 2015 (OCT, MCH)"
  rate_at_response_1_hz: 100.0
  rate_from: "the stimulus rate of every flymsg protocol; DoOR responses are normalised, so the rate of a response of 1 is a named compensation"
  unmeasured: "ORN types without a DoOR response for the odorant get no input"
  odor_ms: 1000.0
  duration_ms: 1000.0
  seeds: [83, 84, 85]
  kc: "^KC"
  apl: APL
  apl_n: 2
  ln_class: ALLN
  pn_class: ALPN
  ln_transmitter: acetylcholine
  responder: "a Kenyon cell that spikes during the odor in at least 2 of the 3 seeds"
  responder_note: "the model has no spontaneous KC activity, so the measured criteria (a rise above baseline SD) reduce to any spike; reliability across seeds stands in for repeated presentations"

arms:
  A: "the default model"
  E: "chemical synapses from cholinergic antennal-lobe local neurons (class ALLN) onto projection neurons (class ALPN) removed: in the fly that coupling is electrical"
  F: "E, and KC -> KC synapses without fast effect, as the model treats metabotropic transmission"

coupling:
  bases: [E, F]
  eln_pn: [0.0, 0.01, 0.03, 0.1, 0.3, 1.0]
  eln_pn_rule: "each cholinergic ALLN and ALPN joined by chemical synapses (either direction) gets an electrical synapse proportional to their synapse count, scaled so that the median PN's total eLN coupling equals the grid value; coupling is the junction conductance over the leak conductance"
  eln_pn_from: "unmeasured: from none to a junction as strong as the PN's leak (coupling coefficient 0.5), in roughly half-decade steps; 0 keeps the sister coupling only"
  sister_cc: 0.013
  sister_rule: "every pair of ALPN of the same type on the same side, coupling c / (1 - c) = 0.0132 (two equal cells)"
  arm_names: "<base>+gap<eln_pn>, e.g. E+gap0.1; 12 coupled arms"

compensations:
  - "Chemical contacts stand in for the unseen electrical ones: EM does not show gap junctions."
  - "Junctions are symmetric and non-rectifying; the fly's pass depolarization better than hyperpolarization (Yaksi & Wilson 2010)."
  - "Spikes do not cross a junction: a LIF spike is a reset, so spikelets are absent and only subthreshold potentials couple."
  - "The sister coefficient is from DM6 pairs and applied to every same-type pair; somatic coefficients underestimate coupling at the junction (Kazama & Wilson 2009)."
  - "The coupling is added by an explicit step on top of the exact membrane update (first order in dt)."

decides:
  sparse_min: 0.01
  sparse_min_from: "Turner et al. 2008: 6% minus one SD (5%)"
  sparse_max: 0.17
  overlap_max: 0.646
  within: "both odors recruit between sparse_min and sparse_max of the Kenyon cells and the shared responders are at most overlap_max of each odor's responders"
  verdict: "the list of arms that are within, or none"

reported:
  overlap_vs_hige:
    decides: false
    what: "the shared share of each odor's responders, next to the 30% (OCT) and 33% (MCH) of Hige et al. 2015"
  pn_spread:
    decides: false
    what: "the share of ALPN neurons that spike during each odor, per arm"
  per_seed:
    decides: false
  least_coupling:
    decides: false
    what: "per base arm, the smallest eLN -> PN coupling of the grid whose arm is within, or none: the model's prediction of the coupling the fly would need, to be compared with a measurement it was not built from"

defaults_changed: false
